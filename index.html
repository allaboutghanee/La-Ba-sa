 if(S.seg==0)b+=st.length?st.map((x,i)=>{const lo=(x.min>0&&x.sn<=x.min)||x.sn<0;return`<div class="card"><div class="rw" style="padding-top:0;border:0"><div class="x"><b>${esc(x.n)}</b><small>Awal ${fq(x.aw)} · beli +${fq(x.ma)} · lain ${x.ad>=0?"+":"−"}${fq(Math.abs(x.ad))}${x.min>0?" · batas "+fq(x.min):""}</small></div><div class="a sf" style="font-size:22px">${fq(x.sn)} ${esc(x.s)}</div></div>${lo?'<span class="pill neg">Menipis</span> ':""}${x.bad?`<span class="pill">${x.bad} belanja beda satuan</span>`:""}<div class="g" style="grid-template-columns:1fr auto;margin-top:10px"><input id="kz${i}" type="number" inputmode="decimal" placeholder="Hitungan sebenarnya"><button onclick="koreksi(${i})">Cocokkan</button></div></div>`}).join("")+'<p class="mu sm">Belanja dengan nama barang yang sama (untuk La Ba’sa) otomatis menambah stok. Pemakaian dicatat di tab Catat pakai.</p>':'<div class="card"><p class="mu" style="margin:0">Belum ada barang yang dipantau. Buka tab <b>Atur</b> untuk menambah.</p></div>';
 else if(S.seg==1)b+=c.items.length?`${dbar()}<div class="card"><label class="f">Barang</label><select id="sb">${sel(c.items.map(x=>x.n),"")}</select><div class="g"><div><label class="f">Jumlah</label><input id="sq" type="number" inputmode="decimal"></div><div><label class="f">Jenis</label><select id="sj"><option>Terpakai</option><option>Rusak / dibuang</option><option>Tambah manual</option></select></div></div><label class="f">Catatan (opsional)</label><input id="sc"><button class="pb" onclick="simpanS()">Simpan</button></div>`+(sk.map(x=>{const k=S.sk[y].indexOf(x),it=c.items.find(i=>i.n.toLowerCase()==x.n.toLowerCase());return`<div class="card"><div class="rw" style="padding:0"><div class="x"><b>${esc(x.n)}</b><small>${esc(x.k||"")}</small></div><div class="a ${x.q>0?"pos":"neg"}">${x.q>0?"+":"−"}${fq(Math.abs(x.q))} ${esc(it?it.s:"")}</div><button class="x1" onclick="dS(${k})">${S.del=="s"+k?"Yakin?":"Hapus"}</button></div></div>`}).join("")||'<p class="mu">Belum ada catatan di tanggal ini.</p>'):'<div class="card"><p class="mu" style="margin:0">Tambahkan barang yang dipantau di tab Atur dulu.</p></div>';
 else b+=`<div class="card"><div class="ct">Mulai hitung stok</div><p class="mu sm" style="margin:0 0 6px">Stok awal tiap barang dihitung pada tanggal ini. Belanja sebelum tanggal ini tidak ikut.</p><input type="date" id="ss" value="${c.start||""}"><button class="pb" style="background:var(--tint);color:var(--tx)" onclick="saveStart()">Simpan tanggal</button></div><div class="card"><div class="ct">Pantau barang baru</div><label class="f">Nama barang (sama dengan nama di belanja)</label><input id="an" list="la" autocomplete="off">${dl("la",S.L.bahan)}<div class="g3"><div><label class="f">Satuan</label><select id="as">${sel(S.L.sat,"")}</select></div><div><label class="f">Stok awal</label><input id="aw" type="number" inputmode="decimal"></div><div><label class="f">Batas min.</label><input id="am" type="number" inputmode="decimal"></div></div><button class="pb" onclick="aItem()">Pantau barang ini</button></div>${c.items.length?`<div class="card" style="padding:4px 14px">${c.items.map((x,i)=>`<div class="rw"><div class="x"><b>${esc(x.n)}</b><small>${esc(x.s)}</small></div><input class="pr" style="width:78px;padding:8px" type="number" inputmode="decimal" value="${x.aw||0}" title="Stok awal" onchange="eItem(${i},'aw',this.value)"><input class="pr" style="width:78px;padding:8px" type="number" inputmode="decimal" value="${x.min||0}" title="Batas min." onchange="eItem(${i},'min',this.value)"><button class="x1" onclick="xItem(${i})">${S.del=="x"+i?"Yakin?":"Hapus"}</button></div>`).join("")}<p class="mu sm" style="margin:6px 0 10px">Kolom kiri stok awal, kanan batas minimum. Menghapus barang dari pantauan tidak menghapus catatan belanja.</p></div>`:""}`;
 return b}
const saveStart=()=>saveStok(c=>{c.start=Q("#ss").value},"Tanggal disimpan ✓");
const aItem=()=>saveStok(c=>{const n=Q("#an").value.trim();if(!n)throw{message:"Isi nama barang."};if(c.items.some(x=>x.n.toLowerCase()==n.toLowerCase()))throw{message:"Barang itu sudah dipantau."};if(!c.start)c.start=S.date;c.items.push({n,s:Q("#as").value,min:+Q("#am").value||0,aw:+Q("#aw").value||0})},"Barang ditambahkan ✓");
const eItem=(i,k,v)=>saveStok(c=>{c.items[i][k]=+v||0},"Disimpan ✓");
function xItem(i){if(S.del!="x"+i){S.del="x"+i;return render()}S.del="";saveStok(c=>{c.items.splice(i,1)},"Dihapus")}
const pushSk=(r)=>{const y=ym(r.d);return ens(y).then(()=>mut("sk",y,a=>a.push(r))).then(a=>{S.sk[y]=a})};
const simpanS=()=>run(async()=>{const g=i=>Q("#"+i).value,q=parseFloat(g("sq"));if(!(q>0))throw{message:"Isi jumlah."};if(fut())throw{message:"Tanggal belum terjadi."};const j=g("sj");await pushSk({d:S.date,n:g("sb"),q:j=="Tambah manual"?q:-q,k:j+(g("sc").trim()?": "+g("sc").trim():"")})},"Tersimpan ✓");
const koreksi=i=>run(async()=>{const x=stok()[i],v=Q("#kz"+i).value;if(v==="")throw{message:"Isi hitungan sebenarnya dulu."};const d=Math.round((parseFloat(v)-x.sn)*1000)/1000;if(!d)throw{message:"Sudah cocok, tidak ada selisih."};if(fut())throw{message:"Tanggal belum terjadi."};await pushSk({d:S.date,n:x.n,q:d,k:"Koreksi hitung"})},"Stok dicocokkan ✓");
function dS(k){const y=ym(S.date);if(S.del!="s"+k){S.del="s"+k;return render()}S.del="";const j=JSON.stringify(S.sk[y][k]);run(async()=>{S.sk[y]=await mut("sk",y,a=>{const i=a.findIndex(x=>JSON.stringify(x)==j);if(i>=0)a.splice(i,1)})},"Dihapus")}
const lbl2=id=>new Date(id.replace(/T(\d\d)-(\d\d)-(\d\d)-(\d+)Z/,"T$1:$2:$3.$4Z")).toLocaleString("id-ID",{dateStyle:"medium",timeStyle:"short"});
function vCad(){const own=OWNERS.includes(S.u.email),m=S.meta,ids=m.ids||[];return`${hdr("Cadangan data")}<div class="card"><p class="mu sm" style="margin:0">Data otomatis tersinkron antar HP lewat Firebase, dan mengubah tampilan aplikasi tidak menghapus data. Cadangan di bawah untuk jaga-jaga kalau ada yang terhapus atau salah impor.</p></div><div class="card"><div class="ct">Cadangan cloud</div><p class="mu sm" style="margin:0 0 8px">${m.last?"Terakhir: "+lbl2(m.last.replace(/[:.]/g,"-")):"Belum ada cadangan."} Otomatis sekali sehari saat pemilik membuka aplikasi, disimpan 14 terakhir. Foto tidak ikut cadangan cloud.</p><button class="pb" style="margin:0" onclick="doBackup()">Cadangkan sekarang</button></div><div class="card"><div class="ct">Simpan ke Drive / file</div><p class="mu sm" style="margin:0 0 8px">Membuat file cadangan lengkap, termasuk foto. Pilih Google Drive di menu bagikan, atau simpan ke HP.</p><button class="pb" style="margin:0" onclick="doExport()">Simpan atau bagikan file</button></div>${own?`<div class="card"><div class="ct">Pulihkan dari cloud</div>${ids.length?ids.map(id=>`<div class="rw"><div class="x"><b>${lbl2(id)}</b></div><button class="x1" onclick="doRestore('${id}')">${S.del=="rs"+id?"Yakin pulihkan?":"Pulihkan"}</button></div>`).join(""):'<p class="mu sm">Belum ada cadangan.</p>'}<p class="mu sm" style="margin:8px 0 0">Memulihkan menimpa data yang ada di cadangan itu. Sebelum itu, aplikasi otomatis membuat cadangan baru.</p></div><div class="card"><div class="ct">Pulihkan dari file</div>${S.del=="rf"?`<input type="file" accept=".json,application/json" onchange="restoreFile(this)">`:`<button class="pb" style="background:var(--tint);color:var(--tx);margin:0" onclick="S.del='rf';render()">Saya paham, pilih file cadangan</button>`}</div>`:'<div class="card"><p class="mu sm" style="margin:0">Memulihkan data hanya bisa dilakukan oleh akun pemilik.</p></div>'}`}
const doBackup=()=>run(async()=>{await backupNow("manual")},"Cadangan tersimpan ✓");
const doExport=()=>run(async()=>{const o=await snap(true),f=new File([JSON.stringify(o)],"cadangan-labasa-"+loc()+".json",{type:"application/json"});if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:"Cadangan La Ba’sa"})}catch(e){if(e.name!="AbortError")throw e}}else{const a=document.createElement("a");a.href=URL.createObjectURL(f);a.download=f.name;a.click()}});
function doRestore(id){if(S.del!="rs"+id){S.del="rs"+id;return render()}S.del="";run(async()=>{const d=await FS.doc("backups/"+id).get();if(!d.exists)throw{message:"Cadangan tidak ditemukan."};const o=JSON.parse(d.data().json);await backupNow("sebelum pulihkan");await restoreDocs(o.docs);setTimeout(()=>location.reload(),700)},"Data dipulihkan ✓")}
function restoreFile(inp){const f=inp.files[0];if(!f)return;S.del="";run(async()=>{let o;try{o=JSON.parse(await f.text())}catch(e){throw{message:"File tidak terbaca."}}if(!o.docs)throw{message:"Ini bukan file cadangan yang benar."};await backupNow("sebelum pulihkan");await restoreDocs(o.docs);setTimeout(()=>location.reload(),700)},"Data dipulihkan ✓")}
const vC=()=>`<div class="hd" style="margin-top:30px"><h1 class="sf">Sambungkan</h1></div><div class="card"><p class="mu sm" style="margin:0 0 8px">Cukup sekali di HP ini. Tempel seluruh kode <b>firebaseConfig</b> dari Firebase (Project settings &gt; Your apps).</p><textarea id="cf" rows="7" placeholder="const firebaseConfig = { apiKey: ..., authDomain: ..., projectId: ..., appId: ... };"></textarea><button class="pb" onclick="saveCfg()">Simpan & lanjut</button></div>`;
function saveCfg(){const t=Q("#cf").value,g=k=>(t.match(new RegExp(k+"\\s*[:=]\\s*[\"']([^\"']+)[\"']"))||[])[1],c={apiKey:g("apiKey"),authDomain:g("authDomain"),projectId:g("projectId"),appId:g("appId")};if(!c.apiKey||!c.projectId){S.msg="Kode belum lengkap. Pastikan apiKey dan projectId ikut tertempel.";return render()}localStorage.setItem("cfg",JSON.stringify(c));location.reload()}
const vL=()=>`<div style="margin-top:34px"><div class="ic" style="margin-bottom:14px">${I("w")}</div><h1 class="sf" style="font-size:40px;margin:0">La Ba’sa</h1><p class="mu sf" style="font-style:italic;margin:2px 0 14px">Pembukuan warung</p></div><div class="card"><label class="f">Email</label><input id="le" type="email" autocomplete="username"><label class="f">Kata sandi</label><input id="lw" type="password" autocomplete="current-password"><button class="pb" onclick="login()">Masuk →</button></div>`;
const login=()=>run(async()=>{try{await AU.signInWithEmailAndPassword(Q("#le").value.trim(),Q("#lw").value)}catch(e){throw{message:"Email atau kata sandi salah."}}});
async function boot(){try{const[m,l,k,u,sc,bm]=await Promise.all([FS.doc("app/menu").get(),FS.doc("app/lists").get(),FS.doc("app/kas").get(),FS.doc("users/"+S.u.uid).get(),FS.doc("stok/cfg").get(),FS.doc("app/backupmeta").get()]);S.menu=m.exists?JSON.parse(m.data().items):[];if(l.exists){const d=l.data();S.L={bahan:[...d.bahan],pem:[...d.pem],sat:[...d.sat],nama:d.nama?[...d.nama]:NAMA}}if(sc.exists)S.stok=JSON.parse(sc.data().data);if(bm.exists)S.meta={last:bm.data().last,ids:[...(bm.data().ids||[])]};if(k.exists){const d=k.data();S.cfg={start:d.start||"",awal:d.awal||{},fisik:d.fisik||{}}}
 S.name=(u.exists&&u.data().name)||(OWNERS.includes(S.u.email)?"Jay":S.u.email.split("@")[0].replace(/^\w/,c=>c.toUpperCase()));
 FS.collection("photos").onSnapshot(s=>{s.forEach(d=>S.ph[d.id]=d.data().d);sr()});
 await ensR();S.ok=true;if(OWNERS.includes(S.u.email)&&!(S.meta.last&&ld2(S.meta.last)==loc()))backupNow("otomatis").then(()=>render()).catch(()=>{})}catch(e){S.msg="Gagal memuat data: "+(e.message||e.code)}ld=false;render()}
render();if(HAS)AU.onAuthStateChanged(u=>{S.u=u;S.ok=false;ld=!!u;render();if(u)boot()});
</script></body></html>
