</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script></head><body>
<header><div class="lg">LB</div><div><h1>La Ba’sa</h1><small>Pembukuan warung</small></div><div class="dot"><i></i>Online</div></header>
<main id="v"><p class="mu">Memuat data…</p></main><nav id="nv"></nav><div id="t"></div>
<script>
let CFG=null;try{CFG=JSON.parse(localStorage.getItem("cfg"))}catch(e){}
const HAS=!!(CFG&&CFG.apiKey&&CFG.projectId);
const Q=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const rp=n=>"Rp "+Math.round(n||0).toLocaleString("id-ID"),loc=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const dd=(n,b)=>{const d=new Date((b||loc())+"T00:00");d.setDate(d.getDate()-n);return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};

const S={tab:"r",date:loc(),met:"Tunai",cart:[],q:"",menu:[],L:{bahan:[],pem:[],sat:[]},sales:{},buys:{},b:{m:"Tunai",u:"La Ba'sa",p:"",s:"pcs"},msg:"",del:"",ok:false,u:null,seeded:false,pv:{}};
let ld=true,tm;
const IC={r:'<path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/>',j:'<path d="M6 6h15l-2 9H8zM6 6 5 3H2M9 20h.01M17 20h.01"/>',b:'<path d="M5 8h14l-1 12H6zM9 8a3 3 0 0 1 6 0"/>',m:'<path d="M4 6h16M4 12h16M4 18h10"/>'};
const TABS=[["r","Ringkasan"],["j","Jual"],["b","Beli"],["m","Menu"]];
const N=(v,k)=>`<span class="n" data-n="${v}" data-k="${k}">${rp(v)}</span>`;
function anim(){document.querySelectorAll(".n").forEach(e=>{const t=+e.dataset.n,k=e.dataset.k,f=S.pv[k]??0;S.pv[k]=t;if(f==t||RM)return;const s=performance.now();(function st(n){const p=Math.min(1,(n-s)/550),v=f+(t-f)*(1-Math.pow(1-p,3));e.textContent=rp(v);if(p<1)requestAnimationFrame(st)})(s)})}
function T(m){const e=Q("#t");e.textContent=m;e.classList.add("s");clearTimeout(tm);tm=setTimeout(()=>e.classList.remove("s"),2200)}
let FS,AU;const subs={};if(HAS){firebase.initializeApp(CFG);FS=firebase.firestore();AU=firebase.auth()}
function ens(y){if(subs[y])return subs[y];return subs[y]=new Promise(res=>{let n=0;const d=()=>{if(++n==2)res()},er=e=>{S.msg="Gagal membaca: "+e.message;d()},up=()=>{if(S.ok&&S.tab=="r")render()};
FS.doc("sales/"+y).onSnapshot(x=>{S.sales[y]=x.exists?JSON.parse(x.data().orders):[];d();up()},er);
FS.doc("buys/"+y).onSnapshot(x=>{S.buys[y]=x.exists?JSON.parse(x.data().rows):[];d();up()},er)})}
const ensW=async()=>{await ens(ym(S.date));await ens(ym(dd(6,S.date)))};
const mut=(k,y,f)=>{const r=FS.doc(k+"/"+y),fl=k=="sales"?"orders":"rows";return FS.runTransaction(async t=>{const x=await t.get(r),a=x.exists?JSON.parse(x.data()[fl]):[];f(a);t.set(r,{[fl]:JSON.stringify(a)});return a})};
async function run(f,ok){S.msg="";try{await f();if(ok)T(ok)}catch(e){S.msg="Gagal: "+(e&&(e.message||e.code)||"coba lagi")}render()}
const fut=()=>S.date>loc();
function go(t){S.tab=t;S.del="";S.msg="";render();const m=Q("#v");m.classList.remove("f");void m.offsetWidth;m.classList.add("f");scrollTo(0,0)}
function setDate(v){run(async()=>{if(!v)return;S.date=v;if(fut())S.msg="Tanggal belum terjadi, cek bulan/hari.";else await ensW()})}
function render(){
 Q("#nv").style.display=S.u?"":"none";Q("#nv").innerHTML=TABS.map(t=>`<button class="${S.tab==t[0]?"on":""}" onclick="go('${t[0]}')"><svg viewBox="0 0 24 24">${IC[t[0]]}</svg>${t[1]}</button>`).join("");
 let h=S.msg?`<div class="m">${esc(S.msg)}</div>`:"";
 if(!HAS)h+=vC();else if(!S.u)h+=vL();else if(!S.ok)h+=ld?'<p class="mu">Memuat data…</p>':'<p class="mu">Data belum bisa dibuka. Cek koneksi internet.</p>';
 else h+={r:vR,j:vJ,b:vB,m:vM}[S.tab]();
 Q("#v").innerHTML=h;anim()}
const lbl=d=>d.split("-").reverse().join("/");
const dateBox=()=>`<label>Tanggal</label><div class="chips">${[["Hari ini",0],["Kemarin",1]].map(([l,n])=>`<button class="${S.date==dd(n)?"on":""}" onclick="setDate('${dd(n)}')">${l}</button>`).join("")}<input type="date" max="${loc()}" value="${S.date}" onchange="setDate(this.value)"></div>`;
function vR(){const y=ym(S.date),O=S.sales[y]||[],B=S.buys[y]||[],od=O.filter(o=>o.d==S.date),bd=B.filter(r=>r[0]==S.date);
 const s=(os,m)=>os.filter(o=>o.m==m).reduce((a,o)=>a+tot(o),0),p=(bs,f)=>bs.filter(f).reduce((a,r)=>a+r[5]*r[7],0),sm=os=>os.reduce((a,o)=>a+tot(o),0);
 const R=(l,a,b,c)=>`<tr class="${c||""}"><td>${l}</td><td>${rp(a)}</td><td>${rp(b)}</td></tr>`;
 const tn=s(od,"Tunai"),qr=s(od,"QRIS"),om=tn+qr,pc=om?Math.round(tn/om*100):50;
 const all=Object.values(S.sales).flat(),W=[6,5,4,3,2,1,0].map(n=>{const d=dd(n,S.date);return[d,all.filter(o=>o.d==d).reduce((a,o)=>a+tot(o),0)]}),mx=Math.max(1,...W.map(x=>x[1]));
 let h=`<div class="c">${dateBox()}</div><div class="c hero"><small>Omzet ${lbl(S.date)}</small><div class="big">${N(om,"om")}</div><div class="sp"><i style="width:${pc}%"></i><i style="width:${100-pc}%"></i></div><div class="lgd"><span>Tunai ${rp(tn)}</span><span>QRIS ${rp(qr)}</span></div></div>
 <div class="st"><div class="c"><small>Pesanan</small><b>${od.length}</b></div><div class="c"><small>Belanja hari ini</small><b>${N(p(bd,()=>1),"bl")}</b></div></div>
 <div class="c"><h2>7 hari terakhir · ketuk batang</h2><div class="wk">${W.map(([d,v])=>`<button class="bc ${d==S.date?"on":""}" onclick="setDate('${d}')"><em>${v?Math.round(v/1000)+"rb":""}</em><i style="height:${Math.max(3,v/mx*84)}%"></i>${new Date(d+"T00:00").toLocaleDateString("id-ID",{weekday:"short"})}</button>`).join("")}</div></div>
 <div class="c"><details><summary>Rincian lengkap hari ini &amp; bulan ini</summary><table><tr><th>Penjualan</th><th>Hari ini</th><th>Bulan ini</th></tr>`
 +R("Tunai",tn,s(O,"Tunai"))+R("QRIS",qr,s(O,"QRIS"))+R("Total omzet",om,sm(O),"t")+`<tr><td>Jumlah pesanan</td><td>${od.length}</td><td>${O.length}</td></tr></table>
 <table style="margin-top:10px"><tr><th>Pembelian</th><th>Hari ini</th><th>Bulan ini</th></tr>`
 +R("Tunai",p(bd,r=>r[1]=="Tunai"),p(B,r=>r[1]=="Tunai"))+R("Transfer",p(bd,r=>r[1]=="Transfer"),p(B,r=>r[1]=="Transfer"))+R("Total",p(bd,()=>1),p(B,()=>1),"t")+R("Untuk La Ba'sa",p(bd,r=>r[2]=="La Ba'sa"),p(B,r=>r[2]=="La Ba'sa"))+R("Untuk pribadi",p(bd,r=>r[2]=="Pribadi"),p(B,r=>r[2]=="Pribadi"))
 +`</table><p class="mu" style="font-size:12px">Omzet bukan laba. Hitung modal (HPP) dulu sebelum menyimpulkan untung.</p></details></div>`;
 h+=`<div class="c"><h2>Pesanan ${lbl(S.date)}</h2>`+(od.length?od.map((o,n)=>{const k=O.indexOf(o);return`<div class="it"><div><b>${o.d.slice(8)}/${o.d.slice(5,7)}-P${String(n+1).padStart(2,"0")}</b> · ${o.m}<small>${o.i.map(x=>esc(x[0])+" ×"+x[1]).join(", ")}</small></div><div style="text-align:right"><b>${rp(tot(o))}</b><br><button class="x" onclick="dO(${k})">${S.del=="o"+k?"Yakin hapus?":"Hapus"}</button></div></div>`}).join(""):'<p class="mu">Belum ada pesanan.</p>')+"</div>";
 return h}
function dO(k){const y=ym(S.date);if(S.del!="o"+k){S.del="o"+k;return render()}S.del="";const j=JSON.stringify(S.sales[y][k]);run(async()=>{S.sales[y]=await mut("sales",y,a=>{const i=a.findIndex(x=>JSON.stringify(x)==j);if(i>=0)a.splice(i,1)})},"Pesanan dihapus")}
const grid=()=>S.menu.map((m,i)=>[m,i]).filter(([m])=>m[0].toLowerCase().includes(S.q.toLowerCase())).map(([m,i])=>`<button class="mn" onclick="add(${i})">${esc(m[0])}<small>${rp(m[1])}</small></button>`).join("")||'<p class="mu">Menu tidak ketemu.</p>';
function filt(v){S.q=v;Q("#mg").innerHTML=grid()}
function vJ(){const sum=S.cart.reduce((a,c)=>a+c[1]*c[2],0),n=S.cart.reduce((a,c)=>a+c[1],0);
 return`<div class="c">${dateBox()}<label>Bayar pakai</label><div class="seg">${["Tunai","QRIS"].map(m=>`<button class="${S.met==m?"on":""}" onclick="S.met='${m}';render()">${m}</button>`).join("")}</div></div>
 <div class="c"><h2>Ketuk menu untuk menambah</h2><input placeholder="Cari menu…" value="${esc(S.q)}" oninput="filt(this.value)" style="margin-bottom:10px"><div class="mg" id="mg">${grid()}</div></div>
 <div class="c"><h2>Pesanan ini</h2>${S.cart.length?S.cart.map((c,i)=>`<div class="ln"><b>${esc(c[0])}</b><button onclick="qt(${i},-1)">−</button><span>${c[1]}</span><button onclick="qt(${i},1)">+</button><input type="number" inputmode="numeric" value="${c[2]}" onchange="pr(${i},this.value)"></div>`).join("")+'<p class="mu" style="font-size:12px;margin:8px 0 0">Harga bisa diubah per baris kalau hari itu beda.</p>':'<p class="mu">Belum ada menu dipilih.</p>'}</div>
 <div class="bar"><div><span><small>${n} item</small><b>${N(sum,"cart")}</b></span><button onclick="simpanJ()">Simpan</button></div></div>`}
function add(i){const m=S.menu[i],c=S.cart.find(x=>x[0]==m[0]&&x[2]==m[1]);c?c[1]++:S.cart.push([m[0],1,m[1]]);const y=scrollY;render();scrollTo(0,y)}
function qt(i,d){S.cart[i][1]+=d;if(S.cart[i][1]<1)S.cart.splice(i,1);const y=scrollY;render();scrollTo(0,y)}
function pr(i,v){S.cart[i][2]=Math.max(0,parseInt(v)||0);render()}
function simpanJ(){run(async()=>{if(fut())throw{message:"Tanggal belum terjadi."};if(!S.cart.length)throw{message:"Pilih menu dulu."};const y=ym(S.date);await ens(y);const o={d:S.date,m:S.met,i:S.cart.map(c=>[...c])};S.sales[y]=await mut("sales",y,a=>a.push(o));S.cart=[];S.pv.cart=0},"Pesanan tersimpan ✓")}
function vB(){const y=ym(S.date),B=S.buys[y]||[],bd=B.filter(r=>r[0]==S.date),b=S.b,t=f=>bd.filter(f).reduce((a,r)=>a+r[5]*r[7],0);
 const op=(a,v)=>a.map(x=>`<option${x==v?" selected":""}>${esc(x)}</option>`).join("");let n=0,last=null;
 return`<div class="c">${dateBox()}<div class="g"><div><label>Metode bayar</label><select onchange="S.b.m=this.value">${op(["Tunai","Transfer"],b.m)}</select></div><div><label>Untuk</label><select onchange="S.b.u=this.value">${op(["La Ba'sa","Pribadi"],b.u)}</select></div></div>
 <label>Nama pemasok</label><input id="bp" list="lp" value="${esc(b.p)}" onchange="S.b.p=this.value"><datalist id="lp">${S.L.pem.map(x=>`<option value="${esc(x)}">`).join("")}</datalist>
 <label>Barang</label><input id="bn" list="lb"><datalist id="lb">${S.L.bahan.map(x=>`<option value="${esc(x)}">`).join("")}</datalist>
 <div class="g3"><div><label>Jumlah</label><input id="bq" type="number" inputmode="decimal" value="1"></div><div><label>Satuan</label><select id="bs">${op(S.L.sat,b.s)}</select></div><div><label>Harga satuan</label><input id="bh" type="number" inputmode="numeric"></div></div>
 <button class="p" onclick="simpanB()">Tambah belanja</button></div>
 <div class="c"><h2>Belanja ${lbl(S.date)}</h2>${bd.length?bd.map(r=>{if(r[3]!==last){n++;last=r[3]}const k=B.indexOf(r);return`<div class="it"><div><b>${esc(r[4])}</b> ${r[5]} ${esc(r[6])} × ${rp(r[7])}<small>${r[3]?esc(r[3])+" · ":""}nota N${String(n).padStart(2,"0")} · ${r[1]} · ${esc(r[2])}</small></div><div style="text-align:right"><b>${rp(r[5]*r[7])}</b><br><button class="x" onclick="dB(${k})">${S.del=="b"+k?"Yakin hapus?":"Hapus"}</button></div></div>`}).join("")
 +`<table style="margin-top:8px"><tr><td>Tunai</td><td>${rp(t(r=>r[1]=="Tunai"))}</td></tr><tr><td>Transfer</td><td>${rp(t(r=>r[1]=="Transfer"))}</td></tr><tr><td>La Ba'sa</td><td>${rp(t(r=>r[2]=="La Ba'sa"))}</td></tr><tr><td>Pribadi</td><td>${rp(t(r=>r[2]=="Pribadi"))}</td></tr><tr class="t"><td>Total belanja</td><td>${rp(t(()=>1))}</td></tr></table>`:'<p class="mu">Belum ada belanja.</p>'}</div>`}
function simpanB(){run(async()=>{const g=i=>Q("#"+i).value,b=S.b;b.p=g("bp").trim();b.s=g("bs");const nm=g("bn").trim(),q=parseFloat(g("bq")),h=parseInt(g("bh"));
 if(fut())throw{message:"Tanggal belum terjadi."};if(!nm||!(q>0)||!(h>=0)||g("bh")==="")throw{message:"Isi barang, jumlah, dan harga."};
 const y=ym(S.date);await ens(y);const row=[S.date,b.m,b.u,b.p,nm,q,b.s,h];S.buys[y]=await mut("buys",y,a=>a.push(row))},"Belanja ditambahkan ✓")}
function dB(k){const y=ym(S.date);if(S.del!="b"+k){S.del="b"+k;return render()}S.del="";const j=JSON.stringify(S.buys[y][k]);run(async()=>{S.buys[y]=await mut("buys",y,a=>{const i=a.findIndex(x=>JSON.stringify(x)==j);if(i>=0)a.splice(i,1)})},"Belanja dihapus")}
function vM(){return(S.seeded?"":'<div class="c"><h2>Data awal</h2><p class="mu">Pilih file seed.json (data Excel) dari HP. Cukup SEKALI, oleh satu orang saja.</p><input type="file" accept=".json,application/json" onchange="seed(this)"></div>')+`<div class="c"><h2>Menu &amp; harga</h2><p class="mu" style="font-size:12px">Pesanan lama tetap memakai harga saat itu, jadi omzet lama tidak bergeser.</p>${S.menu.map((m,i)=>`<div class="it"><span style="align-self:center">${esc(m[0])}</span><input type="number" inputmode="numeric" style="width:110px" value="${m[1]}" onchange="setP(${i},this.value)"></div>`).join("")}</div>
 <div class="c"><h2>Tambah menu</h2><label>Nama menu</label><input id="mn1"><label>Harga</label><input id="mn2" type="number" inputmode="numeric"><button class="p" onclick="addM()">Tambah menu</button></div><div class="c"><button onclick="AU.signOut()">Keluar (${esc(S.u&&S.u.email)})</button></div>`}
const svM=()=>FS.doc("app/menu").set({items:JSON.stringify(S.menu)});
function setP(i,v){run(async()=>{const n=parseInt(v);if(!(n>=0))throw{message:"Harga harus angka."};S.menu[i]=[S.menu[i][0],n];await svM()},"Harga diperbarui ✓")}
function addM(){run(async()=>{const n=Q("#mn1").value.trim(),h=parseInt(Q("#mn2").value);if(!n||!(h>=0))throw{message:"Isi nama dan harga."};if(S.menu.some(m=>m[0].toLowerCase()==n.toLowerCase()))throw{message:"Nama menu sudah ada."};S.menu.push([n,h]);await svM()},"Menu ditambahkan ✓")}
const vL=()=>`<div class="c"><h2>Masuk</h2><label>Email</label><input id="le" type="email" autocomplete="username"><label>Kata sandi</label><input id="lw" type="password" autocomplete="current-password"><button class="p" onclick="login()">Masuk</button></div>`;
function login(){run(async()=>{try{await AU.signInWithEmailAndPassword(Q("#le").value.trim(),Q("#lw").value)}catch(e){throw{message:"Email atau kata sandi salah."}}})}
const vC=()=>`<div class="c"><h2>Sambungkan ke Firebase</h2><p class="mu" style="font-size:13px">Cukup sekali di HP ini. Tempel seluruh kode <b>firebaseConfig</b> dari Firebase (Project settings &gt; Your apps).</p><textarea id="cf" rows="7" placeholder="const firebaseConfig = { apiKey: ..., authDomain: ..., projectId: ..., appId: ... };" style="width:100%;font:inherit;color:var(--tx);background:#8883;border:1px solid var(--bd);border-radius:14px;padding:12px"></textarea><button class="p" onclick="saveCfg()">Simpan &amp; lanjut</button></div>`;
function saveCfg(){const t=Q("#cf").value,g=k=>(t.match(new RegExp(k+"\\s*[:=]\\s*[\"']([^\"']+)[\"']"))||[])[1],c={apiKey:g("apiKey"),authDomain:g("authDomain"),projectId:g("projectId"),appId:g("appId")};
 if(!c.apiKey||!c.projectId){S.msg="Kode belum lengkap. Pastikan apiKey dan projectId ikut tertempel.";return render()}localStorage.setItem("cfg",JSON.stringify(c));location.reload()}
function seed(inp){const f=inp.files[0];if(!f)return;run(async()=>{let D;try{D=JSON.parse(await f.text())}catch(e){throw{message:"File tidak terbaca. Pilih file seed.json."}}
 if(!D.menu||!D.orders||!D.buys||!D.bahan)throw{message:"Ini bukan file seed.json yang benar."};
 const b=FS.batch(),ms={};D.orders.forEach(o=>(ms[o.d.slice(0,7)]=ms[o.d.slice(0,7)]||{o:[],b:[]}).o.push(o));D.buys.forEach(r=>(ms[r[0].slice(0,7)]=ms[r[0].slice(0,7)]||{o:[],b:[]}).b.push(r));
 b.set(FS.doc("app/menu"),{items:JSON.stringify(D.menu)});b.set(FS.doc("app/lists"),{bahan:D.bahan,pem:D.pem,sat:D.sat});
 for(const y in ms){b.set(FS.doc("sales/"+y),{orders:JSON.stringify(ms[y].o)});b.set(FS.doc("buys/"+y),{rows:JSON.stringify(ms[y].b)})}
 await b.commit();S.menu=D.menu.map(m=>[...m]);S.L={bahan:D.bahan,pem:D.pem,sat:D.sat};S.seeded=true},"Data awal diimpor ✓")}
async function boot(){try{const[m,l]=await Promise.all([FS.doc("app/menu").get(),FS.doc("app/lists").get()]);S.seeded=m.exists;S.menu=m.exists?JSON.parse(m.data().items):[];if(l.exists){const d=l.data();S.L={bahan:[...d.bahan],pem:[...d.pem],sat:[...d.sat]}}await ensW();S.ok=true}catch(e){S.msg="Gagal memuat data: "+(e.message||e.code)}ld=false;render()}
render();if(HAS)AU.onAuthStateChanged(u=>{S.u=u;S.ok=false;ld=!!u;render();if(u)boot()});
</script></body></html>
