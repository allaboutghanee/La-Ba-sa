<style>
:root{--bg:#EAE4D9;--sf:#F4F0E8;--cd:#F8F5EF;--tx:#26251F;--mu:#7C776B;--ln:#DDD5C7;--pr:#3C4136;--on:#F3EFE6;--ac:#B25A3C;--tint:#E3DBCD;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#171613;--sf:#1F1D19;--cd:#24221D;--tx:#EDE8DC;--mu:#9B958A;--ln:#34312A;--pr:#D8D1C0;--on:#1D1C18;--ac:#E08A6A;--tint:#2C2A24;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;padding-top:env(safe-area-inset-top,0px)}
main{max-width:520px;margin:auto;padding:12px 16px calc(96px + env(safe-area-inset-bottom,0px))}
.sf{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}
.mu,small{color:var(--mu)}small{display:block;font-size:12.5px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.top b{font-size:22px}
.lk{background:none;border:0;color:var(--mu);font:inherit;font-size:13px;padding:8px 0 8px 12px}
.db{display:flex;gap:8px;align-items:center}.db button{width:42px;height:42px;border-radius:13px;border:0;background:var(--tint);color:var(--tx);font-size:20px;padding:0}.db button:disabled{opacity:.35}
.dl{position:relative;flex:1;text-align:center;background:var(--sf);border-radius:13px;padding:10px 6px;font-weight:600;font-size:14px}.dl input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.hero{background:var(--pr);color:var(--on);border-radius:24px;padding:18px;margin:12px 0}
.hero small{color:inherit;opacity:.8}.hero .big{font-size:34px;font-weight:700;margin:2px 0 8px;letter-spacing:-.01em}
.hero .two{display:flex;gap:16px;flex-wrap:wrap;font-size:13.5px;opacity:.92}
.card{background:var(--cd);border:1px solid var(--ln);border-radius:22px;padding:14px 16px;margin:10px 0}
.ct{font-weight:700;margin-bottom:8px}
.seg{display:flex;gap:6px;margin:4px 0 10px}.seg button{flex:1;padding:10px 4px;border-radius:13px;border:1px solid var(--ln);background:var(--sf);color:var(--tx);font:inherit;font-size:14px}.seg button.on{background:var(--pr);color:var(--on);border-color:var(--pr);font-weight:600}
label.f{display:block;font-size:12.5px;color:var(--mu);margin:8px 0 4px}
input{width:100%;min-width:0;font:inherit;color:var(--tx);background:var(--sf);border:1px solid var(--ln);border-radius:13px;padding:10px 12px;outline:0}input:focus{border-color:var(--pr)}
.ri{display:grid;gap:6px;padding:8px 0;border-bottom:1px dashed var(--ln)}
.r1{grid-template-columns:1fr 64px 104px 34px}.r2{grid-template-columns:1fr 34px}.r3{grid-template-columns:64px 1fr 1fr}
.x1{width:34px;height:40px;border:0;background:none;color:var(--mu);font-size:20px;padding:0}
.add{background:none;border:1px dashed var(--ln);color:var(--tx);border-radius:13px;padding:10px;width:100%;margin-top:8px;font:inherit}
.tt{display:flex;justify-content:space-between;font-weight:700;font-size:17px;margin:12px 0 2px}
.pb{width:100%;border:0;border-radius:16px;background:var(--pr);color:var(--on);font:inherit;font-weight:700;padding:14px;margin-top:10px}
.gh{width:100%;border:1px solid var(--ln);background:none;color:var(--tx);border-radius:16px;padding:12px;margin-top:8px;font:inherit}
.rw{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}.rw .x{flex:1;min-width:0}.a{font-weight:700;white-space:nowrap}
.act{display:flex;gap:8px;margin-top:8px}.act button{flex:1;border:1px solid var(--ln);background:var(--sf);color:var(--tx);border-radius:12px;padding:8px;font:inherit;font-size:13px}.act .dg{color:var(--ac)}
.ln{padding:8px 0;border-top:1px solid var(--ln)}
.h3{margin:20px 0 4px;font-weight:700;font-size:16px}
.er{background:var(--cd);border:1px solid var(--ac);color:var(--ac);border-radius:14px;padding:10px 12px;margin:10px 0;font-size:13.5px}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--ln)}
.nav button{flex:1;max-width:260px;margin:auto;border:0;border-radius:16px;padding:13px;background:var(--tint);color:var(--tx);font:inherit;font-weight:600}.nav button.on{background:var(--pr);color:var(--on)}
#t{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);background:var(--pr);color:var(--on);padding:9px 16px;border-radius:20px;font-size:13.5px;opacity:0;pointer-events:none;transition:.25s;z-index:9}#t.s{opacity:1;transform:translate(-50%,0)}
textarea{width:100%;font:inherit;background:var(--sf);color:var(--tx);border:1px solid var(--ln);border-radius:13px;padding:10px}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script></head>
<body><main id="v"></main><div id="t"></div>
<script>
if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
const Q=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const rp=n=>"Rp "+Math.round(n||0).toLocaleString("id-ID"),LB="La Ba'sa",MAXB=900*1024,COL={sales:"orders",buys:"rows"};
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"),loc=()=>iso(new Date()),
dd=(n,b)=>{const d=new Date(b+"T00:00");d.setDate(d.getDate()+n);return iso(d)},ym=d=>d.slice(0,7),
fd=d=>new Date(d+"T00:00").toLocaleDateString("id-ID",{weekday:"long",day:"numeric",month:"short",year:"numeric"}),
uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
let CFG=null;try{CFG=JSON.parse(localStorage.getItem("cfg"))}catch(e){}
const HAS=!!(CFG&&CFG.apiKey&&CFG.projectId);let FS,AU;if(HAS){firebase.initializeApp(CFG);FS=firebase.firestore();AU=firebase.auth()}
const R0=()=>[["1","",""]],B0=()=>[["","1","",""]];
const S={ld:true,u:null,ok:false,role:"",msg:"",tab:"j",date:loc(),menu:[],L:{bahan:[],pem:[],sat:[]},sales:{},buys:{},
 met:"Tunai",rows:[["","1",""]],cust:"",ed:null,bm:"Tunai",bu:LB,bp:"",brows:B0(),eb:null,del:"",vo:[],vb:[]};
const subs={};let srT=0,tm=0,busy=false;
const sr=()=>{clearTimeout(srT);srT=setTimeout(()=>{if(!/INPUT|TEXTAREA/.test(document.activeElement.tagName))render()},90)};
function T(m){const e=Q("#t");e.textContent=m;e.classList.add("s");clearTimeout(tm);tm=setTimeout(()=>e.classList.remove("s"),2000)}
function ens(y){if(subs[y])return subs[y];return subs[y]=Promise.all(["sales","buys"].map(k=>new Promise(res=>{let f=1;FS.doc(k+"/"+y).onSnapshot(x=>{S[k][y]=x.exists?JSON.parse(x.data()[COL[k]]||"[]"):[];if(f){f=0;res()}else sr()},e=>{S.msg="Gagal membaca: "+e.message;if(f){f=0;res()}})})))}
function mut(k,y,f){if(!["owner","admin","staff"].includes(S.role))return Promise.reject({message:"Akun ini hanya bisa melihat data, tidak bisa mengubah."});
 const r=FS.doc(k+"/"+y);return FS.runTransaction(async t=>{const x=await t.get(r),old=x.exists?(x.data()[COL[k]]||"[]"):"[]",a=JSON.parse(old);f(a);const nj=JSON.stringify(a);
  if(nj.length>MAXB&&nj.length>old.length)throw{message:"Data bulan ini hampir penuh (±1 MB), jadi tidak disimpan. Hubungi pemilik aplikasi."};t.set(r,{[COL[k]]:nj})})}
async function run(f,ok){if(busy)return;busy=true;S.msg="";try{await f();if(ok)T(ok)}catch(e){S.msg=e&&e.code=="permission-denied"?"Akun kamu tidak punya izin untuk ini.":(e&&(e.message||e.code))||"Gagal, coba lagi."}busy=false;render()}
async function addL(rows){const ref=FS.doc("app/lists");await FS.runTransaction(async t=>{const s=await t.get(ref),v=s.exists?s.data():{bahan:[],pem:[],sat:[]};["bahan","pem","sat"].forEach(k=>v[k]=v[k]||[]);
 const has=(a,x)=>a.some(y=>String(y).toLowerCase()==x.toLowerCase());rows.forEach(r=>[["bahan",r[4]],["pem",r[3]],["sat",r[6]]].forEach(([k,x])=>{x=String(x||"").trim();if(x&&!has(v[k],x))v[k].push(x)}));t.set(ref,v);S.L={bahan:v.bahan,pem:v.pem,sat:v.sat}})}
/* ===== hitung ===== */
const tot=o=>Number.isFinite(+o.total)?Math.max(0,+o.total):(o.i||[]).reduce((a,x)=>a+(+x[1]||0)*(+x[2]||0),0),
 sm=os=>os.filter(o=>o.inventoryStatus!=="refunded").reduce((a,o)=>a+tot(o),0),bt=r=>Math.round((+r[5]||0)*(+r[7]||0)),
 pm=(bs,f)=>bs.filter(f).reduce((a,r)=>a+bt(r),0);
const fi=(a,o)=>a.findIndex(z=>o.id?z.id==o.id:JSON.stringify(z)==JSON.stringify(o));
const nextNo=(a,d)=>{const rs=a.filter(x=>x.d===d),n=rs.map(x=>{const m=String(x.transactionNo||"").match(/(?:^|-)P(\d+)$/i);return m?+m[1]:0});return d.slice(8,10)+"/"+d.slice(5,7)+"-P"+(Math.max(rs.length,...n,0)+1)};
/* ===== tampilan ===== */
const dbar=()=>`<div class="db"><button onclick="setDate('${dd(-1,S.date)}')">‹</button><label class="dl">${fd(S.date)}<input type="date" max="${loc()}" value="${S.date}" onchange="setDate(this.value)"></label><button onclick="setDate('${dd(1,S.date)}')"${S.date>=loc()?" disabled":""}>›</button></div>`;
const seg=(o,c,h)=>`<div class="seg">${o.map((x,i)=>`<button class="${x==c?"on":""}" onclick="${h}(${i})">${esc(x)}</button>`).join("")}</div>`;
const dl=(id,a)=>`<datalist id="${id}">${(a||[]).map(x=>`<option value="${esc(x)}">`).join("")}</datalist>`;
function vJ(){const y=ym(S.date),od=(S.sales[y]||[]).filter(o=>o.d==S.date);S.vo=od.slice().reverse();
 const tn=sm(od.filter(o=>o.m=="Tunai")),qr=sm(od.filter(o=>o.m=="QRIS")),sum=S.rows.reduce((a,r)=>a+(+r[1]||0)*(+r[2]||0),0);
 return`${dbar()}<div class="hero"><small>Penjualan hari ini</small><div class="big">${rp(tn+qr)}</div><div class="two"><span>Tunai ${rp(tn)}</span><span>QRIS ${rp(qr)}</span><span>${od.length} pesanan</span></div></div>
 <div class="card"><div class="ct">${S.ed?"Edit pesanan":"Catat penjualan"}</div>${seg(["Tunai","QRIS"],S.met,"setMet")}
 ${S.rows.map((r,i)=>`<div class="ri r1"><input list="dm" placeholder="Menu" value="${esc(r[0])}" oninput="S.rows[${i}][0]=this.value" onchange="pickM(${i},this.value)"><input type="number" inputmode="decimal" placeholder="Jml" value="${esc(r[1])}" oninput="S.rows[${i}][1]=this.value;tt()"><input id="p${i}" type="number" inputmode="numeric" placeholder="Harga" value="${esc(r[2])}" oninput="S.rows[${i}][2]=this.value;tt()"><button class="x1" onclick="delRow(${i})">×</button></div>`).join("")}
 <button class="add" onclick="S.rows.push(['1','','']);render()">+ Tambah baris</button>
 <label class="f">Catatan (opsional)</label><input value="${esc(S.cust)}" oninput="S.cust=this.value">
 <div class="tt"><span>Total</span><span id="tt">${rp(sum)}</span></div>
 <button class="pb" onclick="simpanJ()">${S.ed?"Simpan perubahan":"Simpan penjualan"}</button>${S.ed?'<button class="gh" onclick="cx()">Batal</button>':""}</div>
 ${dl("dm",S.menu.map(m=>m[0]))}<div class="h3">Pesanan hari ini</div>
 ${S.vo.map((o,i)=>`<div class="card"><div class="rw"><div class="x"><b>${esc(o.transactionNo||"Pesanan")}</b><small>${esc(o.m||"-")}${o.c?" · "+esc(o.c):""}</small><small>${(o.i||[]).map(x=>esc(x[1]+"× "+x[0])).join(", ")}</small></div><div class="a">${rp(tot(o))}</div></div>
 <div class="act"><button onclick="edJ(${i})">Edit</button><button class="dg" onclick="dJ(${i})">${S.del=="o"+i?"Yakin hapus?":"Hapus"}</button></div></div>`).join("")||'<p class="mu">Belum ada penjualan.</p>'}`}
function vB(){const y=ym(S.date),dr=(S.buys[y]||[]).filter(r=>r[0]==S.date);S.vb=dr;
 const g=new Map();dr.forEach(r=>{const k=r[9]||[r[1],r[2],r[3]].join("|");if(!g.has(k))g.set(k,[]);g.get(k).push(r)});
 const sum=S.brows.reduce((a,r)=>a+Math.round((+r[1]||0)*(+r[3]||0)),0);
 return`${dbar()}<div class="hero"><small>Pembelian hari ini</small><div class="big">${rp(pm(dr,()=>1))}</div><div class="two"><span>Tunai ${rp(pm(dr,r=>r[1]=="Tunai"))}</span><span>Transfer ${rp(pm(dr,r=>r[1]=="Transfer"))}</span></div><div class="two" style="margin-top:4px"><span>${esc(LB)} ${rp(pm(dr,r=>r[2]==LB))}</span><span>Pribadi ${rp(pm(dr,r=>r[2]=="Pribadi"))}</span></div></div>
 <div class="card"><div class="ct">${S.eb?"Edit barang":"Catat pembelian"}</div>${seg(["Tunai","Transfer"],S.bm,"setBM")}${seg([LB,"Pribadi"],S.bu,"setBU")}
 <label class="f">Pemasok / toko (opsional)</label><input list="dp" value="${esc(S.bp)}" oninput="S.bp=this.value">
 ${S.brows.map((r,i)=>`<div class="ri"><div class="ri r2" style="border:0;padding:0"><input list="db2" placeholder="Barang" value="${esc(r[0])}" oninput="S.brows[${i}][0]=this.value"><button class="x1" onclick="delBRow(${i})">×</button></div><div class="ri r3" style="border:0;padding:0"><input type="number" inputmode="decimal" placeholder="Jml" value="${esc(r[1])}" oninput="S.brows[${i}][1]=this.value;tt()"><input list="ds" placeholder="Satuan" value="${esc(r[2])}" oninput="S.brows[${i}][2]=this.value"><input type="number" inputmode="numeric" placeholder="Harga satuan" value="${esc(r[3])}" oninput="S.brows[${i}][3]=this.value;tt()"></div></div>`).join("")}
 ${S.eb?"":`<button class="add" onclick="S.brows.push(['','1','','']);render()">+ Tambah barang</button>`}
 <div class="tt"><span>Total</span><span id="tt">${rp(sum)}</span></div>
 <button class="pb" onclick="simpanB()">${S.eb?"Simpan perubahan":"Simpan pembelian"}</button>${S.eb?'<button class="gh" onclick="cx()">Batal</button>':""}</div>
 ${dl("dp",S.L.pem)}${dl("db2",S.L.bahan)}${dl("ds",S.L.sat)}<div class="h3">Pembelian hari ini</div>
 ${[...g.values()].map(rs=>`<div class="card"><div class="rw"><div class="x"><b>${esc(rs[0][3])||"Tanpa pemasok"}</b><small>${esc(rs[0][1])} · ${esc(rs[0][2])}</small></div><div class="a">${rp(rs.reduce((a,r)=>a+bt(r),0))}</div></div>
 ${rs.map(r=>{const i=dr.indexOf(r);return`<div class="ln"><div class="rw"><div class="x">${esc(r[4])}<small>${esc(r[5])} ${esc(r[6]||"")} × ${rp(r[7])}</small></div><div class="a">${rp(bt(r))}</div></div><div class="act"><button onclick="edB(${i})">Edit</button><button class="dg" onclick="dB(${i})">${S.del=="b"+i?"Yakin hapus?":"Hapus"}</button></div></div>`}).join("")}</div>`).join("")||'<p class="mu">Belum ada pembelian.</p>'}`}
const vC=()=>`<div class="top" style="margin-top:30px"><b class="sf">Sambungkan</b></div><div class="card"><p class="mu" style="margin:0 0 8px">Cukup sekali di HP ini. Tempel seluruh kode <b>firebaseConfig</b> dari Firebase (Project settings &gt; Your apps).</p><textarea id="cf" rows="7" placeholder="const firebaseConfig = { apiKey: ..., authDomain: ..., projectId: ..., appId: ... };"></textarea><button class="pb" onclick="saveCfg()">Simpan &amp; lanjut</button></div>${S.msg?`<div class="er">${esc(S.msg)}</div>`:""}`;
const vL=()=>`<div style="margin-top:34px"><h1 class="sf" style="font-size:40px;margin:0">La Ba’sa</h1><p class="mu sf" style="font-style:italic;margin:2px 0 14px">Catat penjualan &amp; pembelian</p></div><div class="card"><label class="f">Email</label><input id="le" type="email" autocomplete="username"><label class="f">Kata sandi</label><input id="lw" type="password" autocomplete="current-password"><button class="pb" onclick="login()">Masuk →</button></div>${S.msg?`<div class="er">${esc(S.msg)}</div>`:""}`;
function render(){const v=Q("#v");if(!HAS){v.innerHTML=vC();return}if(S.ld){v.innerHTML='<p class="mu" style="margin-top:40vh;text-align:center">Memuat…</p>';return}if(!S.u){v.innerHTML=vL();return}
 if(!S.ok){v.innerHTML=`<p class="mu" style="margin-top:30vh;text-align:center">${esc(S.msg)||"Memuat…"}</p>${S.msg?'<button class="pb" onclick="AU.signOut()">Keluar</button>':""}`;return}
 v.innerHTML=`<div class="top"><b class="sf">La Ba’sa</b><button class="lk" onclick="AU.signOut()">Keluar</button></div>${S.msg?`<div class="er">${esc(S.msg)}</div>`:""}${S.tab=="j"?vJ():vB()}<div class="nav"><button class="${S.tab=="j"?"on":""}" onclick="go('j')">Penjualan</button><button class="${S.tab=="b"?"on":""}" onclick="go('b')">Pembelian</button></div>`}
/* ===== aksi ===== */
const tt=()=>{const e=Q("#tt");if(!e)return;e.textContent=rp(S.tab=="j"?S.rows.reduce((a,r)=>a+(+r[1]||0)*(+r[2]||0),0):S.brows.reduce((a,r)=>a+Math.round((+r[1]||0)*(+r[3]||0)),0))};
const cx=()=>{S.ed=null;S.eb=null;S.rows=[["","1",""]];S.brows=B0();S.cust="";S.del="";S.msg="";render()};
const go=t=>{cx();S.tab=t;render();scrollTo(0,0)};
const setDate=v=>run(async()=>{if(!v)return;S.ed=null;S.eb=null;S.del="";S.date=v;await ens(ym(v))});
const setMet=i=>{S.met=["Tunai","QRIS"][i];render()},setBM=i=>{S.bm=["Tunai","Transfer"][i];render()},setBU=i=>{S.bu=[LB,"Pribadi"][i];render()};
function pickM(i,v){const m=S.menu.find(x=>String(x[0]).toLowerCase()==v.trim().toLowerCase());if(m){S.rows[i][0]=m[0];S.rows[i][2]=String(m[1]);const p=Q("#p"+i);if(p)p.value=m[1];tt()}}
const delRow=i=>{S.rows.splice(i,1);if(!S.rows.length)S.rows=[["1","",""]];render()},delBRow=i=>{S.brows.splice(i,1);if(!S.brows.length)S.brows=B0();render()};
const simpanJ=()=>run(async()=>{if(S.date>loc())throw{message:"Tanggal belum terjadi, cek bulan/hari."};
 const it=S.rows.filter(r=>r[0].trim()).map(r=>[r[0].trim(),+r[1]||0,+r[2]||0]);if(!it.length||it.some(x=>x[1]<=0))throw{message:"Isi nama menu dan jumlahnya."};
 const total=it.reduce((a,x)=>a+x[1]*x[2],0),acc=S.met=="Tunai"?"t":"r",c=S.cust.trim();
 if(S.ed){const e=S.ed;await mut("sales",ym(e.d),a=>{const i=a.findIndex(z=>z.id==e.id);if(i<0)throw{message:"Pesanan tidak ditemukan, muat ulang."};const o=a[i];o.i=it;o.subtotal=total;o.total=total;o.discount=0;o.m=S.met;o.accountId=acc;delete o.hppSnapshot;if(c)o.c=c;else delete o.c})}
 else{const y=ym(S.date),d=S.date,id=uid(),m=S.met;await ens(y);await mut("sales",y,a=>{const o={id,d,m,orderType:"dinein",accountId:acc,i:it,subtotal:total,discount:0,total,by:S.u.uid,byEmail:S.u.email,paymentStatus:"paid",transactionNo:nextNo(a,d)};if(c)o.c=c;a.push(o)})}
 cx()},"Penjualan tersimpan ✓");
