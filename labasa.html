*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--sans)}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
.app{max-width:540px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top,0px)) 18px 24px}
.top{display:flex;align-items:center;justify-content:space-between;padding-bottom:14px}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:38px;height:38px;border:1.5px solid var(--ink);display:grid;place-items:center;font:700 15px var(--serif);letter-spacing:.5px;border-radius:4px}
.brand b{display:block;font:600 16px/1.1 var(--serif)}.brand small{color:var(--mute);font-size:12px}
.av{width:38px;height:38px;border-radius:50%;overflow:hidden;background:var(--dark);color:var(--on);display:grid;place-items:center;font:600 15px var(--serif)}
.av img,.th img,.hero .ph{width:100%;height:100%;object-fit:cover;display:block}
.hi{padding:14px 0 18px}.hi small{display:block;color:var(--mute);font-size:14px}
.hi h1{margin:0;font:700 44px/1.05 var(--serif);letter-spacing:-.5px}.hi h1 i{color:var(--warn);font-style:normal}
.hi p{margin:6px 0 0;color:var(--mute);font:italic 14px var(--serif)}
.hero{position:relative;overflow:hidden;background:var(--dark);color:#f2eee5;border-radius:8px;padding:18px;display:block;width:100%;text-align:left}
.hero .ph{position:absolute;inset:0;opacity:.38}
.hero>*{position:relative}.hero .l{font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
.hero .n{font:600 34px/1.15 var(--serif);margin:4px 0 6px;font-variant-numeric:tabular-nums}.hero .s{font-size:13px;opacity:.85}
.hero .go{position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:22px;opacity:.7}
.dt{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:16px 0 6px;color:var(--mute);font-size:13px}
input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:9px 10px;width:100%;min-width:0;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--ink)}
.dt input{width:auto}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0 4px}
.qa button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:14px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12.5px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
section{margin-top:26px}.lbl{margin:0 0 6px;font:600 11px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.tb{border-top:1px solid var(--ink)}
.tr{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.tr span:nth-child(n+2){text-align:right}.tr.th{color:var(--mute);font-size:12px;padding:6px 0}.tr.b{font-weight:700}.tr.sub{color:var(--mute);font-size:13.5px}
.tr.one{grid-template-columns:1fr auto}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.row .g{flex:1;min-width:0}.row b{font-weight:600}.row small{display:block;color:var(--mute);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .amt{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.pill{display:inline-block;font-size:11px;padding:1px 8px;border:1px solid var(--line);border-radius:20px;color:var(--mute);margin-left:6px;vertical-align:1px}
.pill.q{border-color:var(--ink);color:var(--ink)}
.acc{padding:14px 0;border-bottom:1px solid var(--line)}

.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}

function stats(pr){
 const s=db.sales.filter(o=>pr(o.date)),p=db.purchases.filter(n=>pr(n.date)),k=db.konsumsi.filter(x=>pr(x.date));
 const tu=sum(s.filter(o=>o.method==='Tunai'),oT),qr=sum(s.filter(o=>o.method==='QRIS'),oT);
 const bt=sum(p.filter(n=>n.method==='Tunai'),nT),bf=sum(p.filter(n=>n.method==='Transfer'),nT);
 return{tu,qr,om:tu+qr,n:s.length,bt,bf,b:bt+bf,lb:sum(p.filter(n=>n.untuk===LB),nT),pr:sum(p.filter(n=>n.untuk==='Pribadi'),nT),kons:sum(k,x=>+x.qty||0)};
}

function balances(){
 const st=db.settings.startDate||'0000-00-00',B={};
 AK().forEach(a=>B[a]={awal:+db.settings.saldoAwal[a]||0,jual:0,beli:0,masuk:0,keluar:0});
 db.sales.filter(o=>o.date>=st).forEach(o=>{const a=o.method==='Tunai'?A_T():o.method==='QRIS'?A_Q():null;if(a&&B[a])B[a].jual+=oT(o)});
 db.purchases.filter(n=>n.date>=st&&n.untuk===LB).forEach(n=>{const a=n.method==='Tunai'?A_T():n.method==='Transfer'?A_Q():null;if(a&&B[a])B[a].beli+=nT(n)});
 db.kasLain.filter(k=>klOk(k)&&k.date>=st).forEach(k=>{const j=+k.jumlah;if(k.jenis==='Uang masuk')B[k.akun].masuk+=j;else if(k.jenis==='Uang keluar')B[k.akun].keluar+=j;else{B[k.akun].keluar+=j;B[k.ke].masuk+=j}});
 for(const a in B){const b=B[a];b.now=b.awal+b.jual-b.beli+b.masuk-b.keluar;const f=db.settings.uangFisik[a];b.fisik=(f===undefined||f==='')?null:+f;b.sel=b.fisik===null?null:b.fisik-b.now}
 return B;
}

}

const tbl=(t,rows,c=['Tanggal dipilih','Bulan ini'])=>`<section><h3 class="lbl">${t}</h3><div class="tb"><div class="tr th"><span></span><span>${c[0]}</span><span>${c[1]}</span></div>${rows.map(r=>`<div class="tr ${r[3]||''}"><span>${r[0]}</span><span>${r[1]}</span><span>${r[2]}</span></div>`).join('')}</div></section>`;

function vHome(){
 const d=day(S.date),m=mon(S.date),B=balances(),ck=checks(),bad=ck.some(c=>c[1]);
 const prev=[...new Set(db.sales.map(o=>o.date))].filter(x=>x<S.date).sort().pop(),pv=prev?day(prev).om:0;
 const delta=pv&&d.om?` · ${d.om>=pv?'↑':'↓'} ${Math.abs(Math.round((d.om-pv)/pv*100))}% dari ${dmy(prev).slice(0,5)}`:'';
 const ban=db.photos.banner;
 return`<div class="page">${head()}
 <div class="hi"><small>${greet()},</small><h1>${esc(user().name)}<i>.</i></h1><p>${longDate()}</p></div>
 <button class="hero" data-a="go" data-t="jual">${ban?`<img class="ph" src="${ban}" alt="">`:''}<div class="l">Total omzet · ${dmy(S.date)}</div><div class="n">${rp(d.om)}</div><div class="s">${d.n} pesanan${delta}</div><span class="go">›</span></button>
 ${dateBar('Tanggal laporan')}
 <div class="qa"><button data-a="go" data-t="jual">${ic('jual')}Jual</button><button data-a="go" data-t="beli">${ic('beli')}Beli</button><button data-a="go" data-t="kas">${ic('kas')}Kas</button><button data-a="go" data-t="more" data-s="harian">${ic('rekap')}Rekap</button></div>
 ${tbl('Penjualan harian',[['Penjualan tunai',rp(d.tu),rp(m.tu)],['Penjualan QRIS',rp(d.qr),rp(m.qr)],['Total omzet',rp(d.om),rp(m.om),'b'],['Jumlah pesanan',d.n,m.n]])}
 ${tbl('Pembelian & konsumsi',[['Pembelian tunai',rp(d.bt),rp(m.bt)],['Pembelian transfer',rp(d.bf),rp(m.bf)],['Total pembelian',rp(d.b),rp(m.b),'b'],['untuk '+LB,rp(d.lb),rp(m.lb),'sub'],['untuk pribadi',rp(d.pr),rp(m.pr),'sub'],['Konsumsi keluarga (porsi)',d.kons,m.kons]])}
 <section><h3 class="lbl">Saldo uang per akun</h3><div class="tb">${AK().map(a=>`<div class="tr one"><span>${esc(a)}</span><span>${rp(B[a].now)}</span></div>`).join('')}</div></section>
 <section><h3 class="lbl">Perlu dicek (harus 0)</h3><div class="tb">${ck.map(c=>`<div class="tr one"><span>${c[0]}</span><span class="${c[1]?'warn':''}">${c[1]}</span></div>`).join('')}</div>${bad?'':'<p class="ok" style="margin:8px 0 0;font-size:13px">Semua catatan lengkap.</p>'}</section>
 <p class="foot2">Omzet bukan laba. Pembelian bahan tidak otomatis menjadi biaya yang habis hari itu. Hitung HPP sebelum menyimpulkan keuntungan.</p></div>`;
}

function vJual(){
 const os=db.sales.filter(o=>o.date===S.date).sort((a,b)=>a.id<b.id?1:-1),d=day(S.date);
 let body;
 if(S.jt==='rekap')body=rekapMenu();
 else body=os.length?os.map(o=>`<button class="row" data-a="order" data-id="${esc(o.id)}"><div class="g"><b>${esc(o.id.split('-')[1])}${o.method?`<span class="pill ${o.method==='QRIS'?'q':''}">${o.method}</span>`:''}</b><small>${esc(o.items.map(i=>i[1]+'× '+i[0]).join(', '))}${o.note?' · '+esc(o.note):''}</small></div><span class="amt">${rp(oT(o))}</span></button>`).join(''):'<div class="empty">Belum ada penjualan di tanggal ini.</div>';
 return`<div class="page">${head()}<h2>Penjualan</h2><p class="sb">${d.n} pesanan · ${rp(d.om)} · Tunai ${rp(d.tu)} · QRIS ${rp(d.qr)}</p>${dateBar()}
 <div class="tabs"><button class="${S.jt==='pesanan'?'on':''}" data-a="jt" data-v="pesanan">Pesanan</button><button class="${S.jt==='rekap'?'on':''}" data-a="jt" data-v="rekap">Rekap per menu</button></div>${body}</div><button class="fab" data-a="order" aria-label="Catat penjualan">+</button>`;
}
function rekapMenu(){
 const mk=pr=>{const M={};db.sales.filter(o=>pr(o.date)).forEach(o=>o.items.forEach(i=>{const x=M[i[0]]||(M[i[0]]=[0,0]);x[0]+=i[1];x[1]+=i[1]*i[2]}));return M},a=mk(x=>x===S.date),b=mk(x=>x.slice(0,7)===S.date.slice(0,7));
 const names=[...new Set([...db.lists.menu.map(m=>m.name),...Object.keys(b)])],f=(x,k)=>x?(k?rp(x[1]):x[0]):'-';
 const T=M=>Object.values(M).reduce((s,x)=>[s[0]+x[0],s[1]+x[1]],[0,0]);
 return`<p class="sb">Menu yang dicatat berkali-kali dijumlahkan otomatis.</p><div class="tw"><table><tr><th>Menu</th><th>Terjual</th><th>Penjualan</th><th>Terjual (bln)</th><th>Penjualan (bln)</th></tr><tr class="b"><td>TOTAL</td><td>${T(a)[0]}</td><td>${rp(T(a)[1])}</td><td>${T(b)[0]}</td><td>${rp(T(b)[1])}</td></tr>${names.map(n=>`<tr><td>${esc(n)}</td><td>${f(a[n],0)}</td><td>${f(a[n],1)}</td><td>${f(b[n],0)}</td><td>${f(b[n],1)}</td></tr>`).join('')}</table></div>`;
}

function vBeli(){
 const ns=db.purchases.filter(n=>n.date===S.date).sort((a,b)=>a.id<b.id?1:-1),d=day(S.date);
 return`<div class="page">${head()}<h2>Pembelian</h2><p class="sb">${rp(d.b)} · ${LB} ${rp(d.lb)} · Pribadi ${rp(d.pr)}</p>${dateBar()}
 ${ns.length?ns.map(n=>`<button class="row" data-a="nota" data-id="${esc(n.id)}"><div class="g"><b>${esc(n.supplier||'(tanpa pemasok)')}<span class="pill">${esc(n.untuk||'?')}</span><span class="pill ${n.method==='Transfer'?'q':''}">${esc(n.method||'?')}</span></b><small>${esc(n.items.map(i=>i[0]+' '+i[1]+(i[2]?' '+i[2]:'')).join(', '))}</small></div><span class="amt">${rp(nT(n))}</span></button>`).join(''):'<div class="empty">Belum ada pembelian di tanggal ini.</div>'}</div><button class="fab" data-a="nota" aria-label="Catat nota">+</button>`;

function vKas(){
 const B=balances(),tot=k=>sum(AK(),a=>B[a][k]),kl=[...db.kasLain].sort((a,b)=>a.date<b.date?1:-1);
 return`<div class="page">${head()}<h2>Kas</h2><p class="sb">Semua angka otomatis dari penjualan, pembelian, dan kas lain.</p>
 <div class="dt"><span>Tanggal mulai pembukuan</span><input type="date" data-start value="${db.settings.startDate}"></div>
 ${AK().map((a,ix)=>{const b=B[a];return`<div class="acc"><div class="h"><b>${esc(a)}</b><span class="v">${rp(b.now)}</span></div><div class="d"><span>Saldo awal</span><span>${rp(b.awal)}</span><span>+ Penjualan</span><span>${rp(b.jual)}</span><span>− Pembelian</span><span>${rp(b.beli)}</span><span>+ Masuk lain & pindahan</span><span>${rp(b.masuk)}</span><span>− Keluar lain & pindahan</span><span>${rp(b.keluar)}</span></div>
 <div class="f"><div><label>Saldo awal (Rp)</label><input inputmode="numeric" data-awal="${ix}" value="${db.settings.saldoAwal[a]||''}"></div><div><label>Uang fisik (hasil hitung)</label><input inputmode="numeric" data-fisik="${ix}" value="${b.fisik??''}"></div></div>${b.sel!==null?`<div style="margin-top:6px;font-size:13px" class="${b.sel?'warn':'ok'}">Selisih ${rp(b.sel)}${b.sel?' — ada yang belum tercatat':' — cocok'}</div>`:''}</div>`}).join('')}
 <div class="acc"><div class="h"><b>TOTAL SEMUA AKUN</b><span class="v">${rp(tot('now'))}</span></div></div>
 <section><h3 class="lbl">Kas lain: di luar jual-beli & pindah uang</h3>
 ${kl.length?kl.map(k=>`<button class="row" data-a="kl" data-id="${k.id}"><div class="g"><b>${esc(k.ket||k.jenis)}<span class="pill">${esc(k.jenis)}</span>${klOk(k)?'':'<span class="pill warn">belum lengkap</span>'}</b><small>${dmy(k.date)} · ${esc(k.akun||'?')}${k.jenis==='Pindah uang'?' → '+esc(k.ke||'?'):''}${k.kat?' · '+esc(k.kat):''}</small></div><span class="amt">${rp(+k.jumlah||0)}</span></button>`).join(''):'<div class="empty">Belum ada catatan.</div>'}
 <button class="btn g" style="margin-top:12px" data-a="kl">+ Catat kas lain</button></section>
 <p class="foot2">Penjualan tunai masuk Kas tunai, QRIS masuk Rekening gabungan. Pembelian pribadi tidak mengurangi kas warung. Tiap malam hitung uang di laci, isi "Uang fisik".</p></div>`;
}

 if(!S.sub)return`<div class="page">${head()}<h2>Lainnya</h2><p class="sb">${esc(user().name)} · ${esc(me)}</p>${MORE.map(m=>`<button class="row" data-a="go" data-t="more" data-s="${m[0]}"><div class="g"><b>${m[1]}</b></div><span>›</span></button>`).join('')}<button class="row" data-a="logout"><div class="g"><b>Keluar</b></div></button></div>`;
 const bk=`<button class="back" data-a="go" data-t="more">‹ Kembali</button>`,f={harian:vHarian,kons:vKons,daftar:vDaftar,set:vSet,data:vData}[S.sub];

 const ks=db.konsumsi.filter(k=>k.date===S.date);
 return`<h2>Konsumsi keluarga</h2><p class="sb">Menu yang dimakan keluarga atau pribadi, bukan untuk pelanggan. Jangan dicatat sebagai penjualan.</p>${dateBar()}
 ${ks.length?ks.map(k=>`<button class="row" data-a="kons" data-id="${k.id}"><div class="g"><b>${esc(k.nama)}</b><small>${esc(k.menu)}${k.note?' · '+esc(k.note):''}</small></div><span class="amt">${k.qty}×</span></button>`).join(''):'<div class="empty">Belum ada catatan di tanggal ini.</div>'}
 <button class="btn g" style="margin-top:12px" data-a="kons">+ Catat konsumsi</button>`;

 ${db.lists.menu.map((m,i)=>`<button class="row" data-a="menu" data-i="${i}">${thumb(m)}<div class="g"><b>${esc(m.name)}</b></div><span class="amt">${rp(m.price)}</span></button>`).join('')}
 <button class="btn g" style="margin:12px 0" data-a="menu">+ Tambah menu</button>${chips('bahan','Bahan / barang')}${chips('pemasok','Nama pemasok')}${chips('satuan','Satuan')}${chips('kategoriKas','Kategori kas')}${chips('konsumsiNama','Nama (konsumsi)')}`;

function vSet(){

 return`<h2>Pengaturan</h2><p class="sb">Masuk sebagai ${esc(me)}</p>
 <section><h3 class="lbl">Profil saya</h3><label class="fl">Nama panggilan (dipakai di sapaan)</label><input data-uname value="${esc(u.name)}">

 <section><h3 class="lbl">Foto sampul beranda</h3><div style="display:flex;gap:8px"><button class="btn sm g" data-a="foto" data-w="banner">${db.photos.banner?'Ganti':'Pilih'} foto</button>${db.photos.banner?'<button class="btn sm g" data-a="fotodel" data-w="banner">Hapus</button>':''}</div></section>
 <section><h3 class="lbl">Akun</h3>${Object.entries(db.users).map(([e,x])=>`<div class="row"><div class="g"><small>${esc(e)}${x.role==='owner'?' · pemilik':''}</small><input data-un="${esc(e)}" value="${esc(x.name)}" style="margin-top:4px"></div>${e!==me&&x.role!=='owner'?`<button class="warn" data-a="udel" data-e="${esc(e)}">Hapus</button>`:''}</div>`).join('')}
 <div class="two" style="margin-top:10px"><input id="ne" type="email" placeholder="Email akun baru"><input id="nn" placeholder="Nama panggilan"></div><button class="btn g" style="margin-top:8px" data-a="uadd">+ Tambah akun</button></section>`;

const TABS=[['home','Beranda'],['jual','Penjualan'],['beli','Pembelian'],['kas','Kas'],['more','Lainnya']],VIEW={home:vHome,jual:vJual,beli:vBeli,kas:vKas,more:vMore};
function render(){
 closeSheet();
 if(!me||!db.users[me]){$('#root').innerHTML=vLogin(render.l);return}
 $('#root').innerHTML=`<div class="app">${VIEW[S.tab]()}</div><nav class="nav"><div>${TABS.map(t=>`<button class="${S.tab===t[0]?'on':''}" data-a="go" data-t="${t[0]}">${ic(t[0]==='jual'?'jual':t[0])}${t[1]}</button>`).join('')}</div></nav>`;
}
function sheet(h){$('#sheet').innerHTML=h;$('#sheet').classList.add('on');$('#scr').classList.add('on');document.body.style.overflow='hidden'}
function closeSheet(){$('#sheet').classList.remove('on');$('#scr').classList.remove('on');document.body.style.overflow=''}
const opt=(a,v)=>a.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('');
const seg=(k,vals,cur)=>`<div class="seg" data-seg="${k}">${vals.map(v=>`<button type="button" class="${v===cur?'on':''}" data-v="${esc(v)}">${esc(v)}</button>`).join('')}</div>`;
const segVal=k=>$(`#sheet [data-seg=${k}] .on`)?.dataset.v||'';
const nextId=(arr,date,p)=>{const pre=date.slice(8)+'/'+date.slice(5,7)+'-'+p;const n=Math.max(0,...arr.filter(x=>x.id.startsWith(pre)).map(x=>+x.id.slice(pre.length)||0))+1;return pre+String(n).padStart(2,'0')};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);

/* ---------- form: penjualan ---------- */
let D;
function orderSheet(id){
 const o=id?db.sales.find(x=>x.id===id):null;
 D={id:o?.id,date:o?.date||S.date,it:{}};(o?.items||[]).forEach(i=>D.it[i[0]]={q:i[1],p:i[2]});
 sheet(`<h3>${o?'Ubah pesanan':'Catat penjualan'}</h3>
 <div class="two"><div><label class="fl">Tanggal</label><input type="date" id="od" value="${D.date}"></div><div><label class="fl">Metode bayar</label>${seg('mt',['Tunai','QRIS'],o?.method||'Tunai')}</div></div>
 <label class="fl">Menu</label><input id="os" placeholder="Cari menu…" style="margin-bottom:4px">
 <div id="ol">${db.lists.menu.map(m=>{const c=D.it[m.name];return`<div class="mi ${c?'on':''}" data-m="${esc(m.name)}" data-p="${m.price}">${thumb(m)}<div class="g"><b>${esc(m.name)}</b><small>${rp(m.price)}</small></div><div class="step"><button data-a="st" data-d="-1">−</button><span class="q">${c?.q||0}</span><button data-a="st" data-d="1">+</button></div><input class="sp" inputmode="numeric" placeholder="Harga khusus (isi hanya jika beda)" value="${c&&c.p!==m.price?c.p:''}"></div>`}).join('')}</div>
 <label class="fl">Catatan</label><input id="on" value="${esc(o?.note||'')}">
 <div class="foot"><div class="tt"><span>Total</span><span id="ot">Rp 0</span></div><button class="btn" data-a="osave">Simpan</button>${o?'<button class="btn d" style="margin-top:8px" data-a="odel">Hapus pesanan</button>':''}</div>`);
 oTot();
}
function oTot(){const t=sum(Object.values(D.it),x=>x.q*x.p);$('#ot').textContent=rp(t);$('#sheet .foot .btn').disabled=!t}
function osave(){
 const items=Object.entries(D.it).filter(([,x])=>x.q>0).map(([m,x])=>[m,x.q,x.p]);if(!items.length)return;
 const date=$('#od').value;if(!date)return toast('Isi tanggal');
 const rec={id:D.id,date,method:segVal('mt'),items,note:$('#on').value.trim()};
 if(D.id){const i=db.sales.findIndex(x=>x.id===D.id);if(db.sales[i].date!==date)rec.id=nextId(db.sales,date,'P');db.sales[i]=rec}else{rec.id=nextId(db.sales,date,'P');db.sales.push(rec)}
 S.date=date;save();render();toast('Tersimpan');
}

/* ---------- form: pembelian ---------- */
function irow(r=['',1,'',0]){return`<div class="ir"><input list="dl-b" placeholder="Barang" value="${esc(r[0])}"><input inputmode="decimal" value="${r[1]}"><select><option value=""></option>${opt(db.lists.satuan,r[2])}</select><input inputmode="numeric" placeholder="Harga" value="${r[3]||''}"><button data-a="irdel" aria-label="Hapus">×</button></div>`}
function notaSheet(id){
 const n=id?db.purchases.find(x=>x.id===id):null,last=db.purchases[db.purchases.length-1];
 S.beli=id||null;
 sheet(`<h3>${n?'Ubah nota':'Catat nota pembelian'}</h3><datalist id="dl-b">${db.lists.bahan.map(b=>`<option value="${esc(b)}">`).join('')}</datalist><datalist id="dl-p">${db.lists.pemasok.map(b=>`<option value="${esc(b)}">`).join('')}</datalist>
 <div class="two"><div><label class="fl">Tanggal</label><input type="date" id="nd" value="${n?.date||S.date}"></div><div><label class="fl">Nama pemasok</label><input id="np" list="dl-p" value="${esc(n?.supplier||'')}"></div></div>
 <div class="two"><div><label class="fl">Metode bayar</label>${seg('nm',['Tunai','Transfer'],n?.method||'Tunai')}</div><div><label class="fl">Untuk</label>${seg('nu',[LB,'Pribadi'],n?.untuk||LB)}</div></div>
 <label class="fl">Barang · jumlah · satuan · harga satuan</label><div id="nl">${(n?.items||[['',1,'',0]]).map(irow).join('')}</div><button class="btn sm g" data-a="iradd">+ Barang</button>
 <div class="foot"><div class="tt"><span>Total nota</span><span id="nt">Rp 0</span></div><button class="btn" data-a="nsave">Simpan</button>${n?'<button class="btn d" style="margin-top:8px" data-a="ndel">Hapus nota</button>':''}</div>`);
 nTot();
}
const nRows=()=>[...document.querySelectorAll('#nl .ir')].map(r=>{const i=r.querySelectorAll('input,select');return[i[0].value.trim(),+i[1].value.replace(',','.')||0,i[2].value,+i[3].value.replace(/\D/g,'')||0]});
const nTot=()=>{const e=$('#nt');if(e)e.textContent=rp(sum(nRows(),r=>r[1]*r[3]))};
function nsave(){
 const items=nRows().filter(r=>r[0]&&r[1]>0&&r[3]>0).map(r=>[...r,'']);if(!items.length)return toast('Isi minimal satu barang');
 const date=$('#nd').value,sup=$('#np').value.trim();if(!date)return toast('Isi tanggal');
 const old=S.beli?db.purchases.find(x=>x.id===S.beli):null;if(old)old.items.forEach(oi=>{const m=items.find(i=>i[0]===oi[0]&&i[3]===oi[3]);if(m)m[4]=oi[4]});
 const rec={id:S.beli,date,method:segVal('nm'),untuk:segVal('nu'),supplier:sup,items};
 if(S.beli){const i=db.purchases.findIndex(x=>x.id===S.beli);if(db.purchases[i].date!==date)rec.id=nextId(db.purchases,date,'N');db.purchases[i]=rec}else{rec.id=nextId(db.purchases,date,'N');db.purchases.push(rec)}
 items.forEach(i=>{if(!db.lists.bahan.includes(i[0]))db.lists.bahan.push(i[0])});if(sup&&!db.lists.pemasok.includes(sup))db.lists.pemasok.push(sup);
 S.date=date;save();render();toast('Tersimpan');
}

/* ---------- form: kas lain, konsumsi, menu ---------- */
function klSheet(id){
 const k=id?db.kasLain.find(x=>x.id===id):{date:S.date,jenis:'Uang keluar',akun:A_T()};
 sheet(`<h3>${id?'Ubah kas lain':'Catat kas lain'}</h3><p class="sb" style="margin:0">Satu kejadian = satu baris. Penjualan & pembelian tidak dicatat di sini.</p>
 <label class="fl">Jenis</label>${seg('kj',['Uang masuk','Uang keluar','Pindah uang'],k.jenis)}
 <div class="two"><div><label class="fl">Tanggal</label><input type="date" id="kd" value="${k.date}"></div><div><label class="fl">Jumlah (Rp)</label><input id="kj2" inputmode="numeric" value="${k.jumlah||''}"></div></div>
 <label class="fl">Keterangan</label><input id="kk" value="${esc(k.ket||'')}" placeholder="mis. listrik, gas, setor ke ummi">
 <div class="two"><div><label class="fl">Akun (pindah uang: akun ASAL)</label><select id="ka">${opt(AK(),k.akun)}</select></div><div><label class="fl">Ke akun (hanya pindah uang)</label><select id="ke"><option></option>${opt(AK(),k.ke)}</select></div></div>
 <label class="fl">Kategori (opsional)</label><select id="kc"><option></option>${opt(db.lists.kategoriKas,k.kat)}</select><label class="fl">Catatan</label><input id="kn" value="${esc(k.note||'')}">
 <div class="foot"><button class="btn" data-a="klsave" data-id="${id||''}">Simpan</button>${id?`<button class="btn d" style="margin-top:8px" data-a="kldel" data-id="${id}">Hapus</button>`:''}</div>`);
}
function klsave(id){
 const r={id:id||uid(),date:$('#kd').value,jenis:segVal('kj'),ket:$('#kk').value.trim(),akun:$('#ka').value,ke:$('#ke').value,jumlah:+$('#kj2').value.replace(/\D/g,'')||0,kat:$('#kc').value,note:$('#kn').value.trim()};
 if(r.jenis!=='Pindah uang')r.ke='';
 if(!klOk(r))return toast(r.jenis==='Pindah uang'?'Lengkapi tanggal, jumlah, dan akun asal ≠ tujuan':'Lengkapi tanggal, akun, dan jumlah');
 const i=db.kasLain.findIndex(x=>x.id===r.id);i>=0?db.kasLain[i]=r:db.kasLain.push(r);save();render();toast('Tersimpan');
}
function konsSheet(id){
 const k=id?db.konsumsi.find(x=>x.id===id):{date:S.date,qty:1,nama:db.lists.konsumsiNama[0],menu:db.lists.menu[0].name};
 sheet(`<h3>${id?'Ubah konsumsi':'Catat konsumsi'}</h3><div class="two"><div><label class="fl">Tanggal</label><input type="date" id="cd" value="${k.date}"></div><div><label class="fl">Jumlah (porsi)</label><input id="cq" inputmode="numeric" value="${k.qty}"></div></div>
 <div class="two"><div><label class="fl">Nama</label><select id="cn">${opt(db.lists.konsumsiNama,k.nama)}</select></div><div><label class="fl">Menu</label><select id="cm">${opt(db.lists.menu.map(m=>m.name),k.menu)}</select></div></div><label class="fl">Catatan</label><input id="cc" value="${esc(k.note||'')}">
 <div class="foot"><button class="btn" data-a="ksave" data-id="${id||''}">Simpan</button>${id?`<button class="btn d" style="margin-top:8px" data-a="kdel" data-id="${id}">Hapus</button>`:''}</div>`);
}
function menuSheet(i){
 const m=i!==undefined&&i!==''?db.lists.menu[+i]:{name:'',price:0};D={i:i===undefined||i===''?-1:+i,photo:m.photo||null};
 sheet(`<h3>${D.i>=0?'Ubah menu':'Menu baru'}</h3><div style="display:flex;align-items:center;gap:12px;margin-bottom:6px"><span id="mp">${thumb({name:m.name||'?',photo:D.photo})}</span><button class="btn sm g" data-a="mfoto">Ganti foto</button><button class="btn sm g" data-a="mfotodel">Hapus foto</button></div>
 <label class="fl">Nama menu</label><input id="mn" value="${esc(m.name)}"><label class="fl">Harga (Rp)</label><input id="mh" inputmode="numeric" value="${m.price||''}">
 <div class="foot"><button class="btn" data-a="msave">Simpan</button>${D.i>=0?'<button class="btn d" style="margin-top:8px" data-a="mdel">Hapus menu</button>':''}</div>`);
}

/* ---------- aksi ---------- */
const go=(t,s)=>{S.tab=t;S.sub=s||null;render();scrollTo(0,0)};
const ACT={
 go:d=>go(d.t,d.s),jt:d=>{S.jt=d.v;render()},
 login(){const e=$('#le').value.trim().toLowerCase();if(!/^\S+@\S+\.\S+$/.test(e))return toast('Email belum benar');if(db.users[e]){me=e;try{localStorage.setItem(SES,e)}catch(x){}render.l=null;render()}else{render.l={e};render()}},
 mk(){const n=$('#ln').value.trim();if(!n)return toast('Isi nama panggilan');const e=render.l.e;db.users[e]={name:n,role:'staff'};save();me=e;try{localStorage.setItem(SES,e)}catch(x){}render.l=null;render()},
 logout(){me=null;try{localStorage.removeItem(SES)}catch(e){}render()},
 order:d=>orderSheet(d.id),osave,odel(){if(confirm('Hapus pesanan ini?')){db.sales=db.sales.filter(x=>x.id!==D.id);save();render()}},
 st(d,t){const r=t.closest('.mi'),m=r.dataset.m,p=+r.dataset.p,c=D.it[m]||(D.it[m]={q:0,p});c.q=Math.max(0,c.q+ +d.d);r.querySelector('.q').textContent=c.q;r.classList.toggle('on',c.q>0);oTot()},
 nota:d=>notaSheet(d.id),nsave,ndel(){if(confirm('Hapus nota ini?')){db.purchases=db.purchases.filter(x=>x.id!==S.beli);save();render()}},
 iradd(){$('#nl').insertAdjacentHTML('beforeend',irow())},irdel(d,t){t.closest('.ir').remove();nTot()},
 kl:d=>klSheet(d.id),klsave:d=>klsave(d.id),kldel(d){if(confirm('Hapus catatan ini?')){db.kasLain=db.kasLain.filter(x=>x.id!==d.id);save();render()}},
 kons:d=>konsSheet(d.id),kdel(d){db.konsumsi=db.konsumsi.filter(x=>x.id!==d.id);save();render()},
 ksave(d){const r={id:d.id||uid(),date:$('#cd').value,qty:+$('#cq').value||1,nama:$('#cn').value,menu:$('#cm').value,note:$('#cc').value.trim()};if(!r.date)return toast('Isi tanggal');const i=db.konsumsi.findIndex(x=>x.id===r.id);i>=0?db.konsumsi[i]=r:db.konsumsi.push(r);S.date=r.date;save();render()},
 menu:d=>menuSheet(d.i),mfoto(){pickImage(400,u=>{D.photo=u;$('#mp').innerHTML=thumb({name:$('#mn').value||'?',photo:u})})},mfotodel(){D.photo=null;$('#mp').innerHTML=thumb({name:$('#mn').value||'?'})},
 msave(){const n=$('#mn').value.trim(),p=+$('#mh').value.replace(/\D/g,'')||0;if(!n)return toast('Isi nama menu');const L=db.lists.menu;
  if(D.i>=0){const o=L[D.i].name;if(o!==n){db.sales.forEach(s=>s.items.forEach(i=>{if(i[0]===o)i[0]=n}));db.konsumsi.forEach(k=>{if(k.menu===o)k.menu=n})}L[D.i]={name:n,price:p,photo:D.photo||undefined}}else L.push({name:n,price:p,photo:D.photo||undefined});save();render()},
 mdel(){if(confirm('Hapus menu dari daftar? Riwayat penjualan tetap ada.')){db.lists.menu.splice(D.i,1);save();render()}},
 ladd(d){const i=$(`[data-ladd=${d.k}]`),v=i.value.trim();if(v&&!db.lists[d.k].includes(v)){db.lists[d.k].push(v);save();render()}},ldel(d){db.lists[d.k].splice(+d.i,1);save();render()},
 foto(d){pickImage(d.w==='banner'?900:256,u=>{d.w==='banner'?db.photos.banner=u:db.photos.avatar[me]=u;save();render()})},fotodel(d){d.w==='banner'?db.photos.banner=null:delete db.photos.avatar[me];save();render()},
 uadd(){const e=$('#ne').value.trim().toLowerCase(),n=$('#nn').value.trim();if(!/^\S+@\S+\.\S+$/.test(e)||!n)return toast('Isi email dan nama');if(db.users[e])return toast('Akun sudah ada');db.users[e]={name:n,role:'staff'};save();render()},
 udel(d){if(confirm('Hapus akun '+d.e+'?')){delete db.users[d.e];delete db.photos.avatar[d.e];save();render()}},
 export(){const b=new Blob([JSON.stringify(db,null,1)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='labasa-data-'+lt()+'.json';a.click()},
 import(){const i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.onchange=()=>{const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.sales||!x.purchases||!x.lists||!x.users)throw 0;if(!confirm('Ganti semua data saat ini dengan isi file?'))return;db=x;db.photos=db.photos||{avatar:{},banner:null};save();if(!db.users[me]){me=null}render();toast('Data diimpor')}catch(e){toast('File JSON tidak sesuai')}};r.readAsText(i.files[0])};i.click()},
 reset(){if(confirm('Semua perubahan dihapus dan data kembali seperti spreadsheet awal. Lanjut?')){db=JSON.parse(JSON.stringify(SEED));save();me=null;render()}}
};
document.addEventListener('click',e=>{
 if(e.target.id==='scr')return closeSheet();
 const s=e.target.closest('[data-seg] button');if(s){s.parentNode.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===s));return}
 const t=e.target.closest('[data-a]');if(t&&ACT[t.dataset.a])ACT[t.dataset.a](t.dataset,t);
});
document.addEventListener('change',e=>{
 const t=e.target,D_=t.dataset;
 if('date' in D_){if(t.value){S.date=t.value;render()}}
 else if('start' in D_){db.settings.startDate=t.value;save();render()}
 else if('awal' in D_){db.settings.saldoAwal[AK()[D_.awal]]=+t.value.replace(/\D/g,'')||0;save();render()}
 else if('fisik' in D_){db.settings.uangFisik[AK()[D_.fisik]]=t.value.replace(/\D/g,'');save();render()}
 else if('ct' in D_){db.settings.catatanTutup[D_.ct]=t.value;save()}
 else if('uname' in D_){if(t.value.trim()){user().name=t.value.trim();save();toast('Nama disimpan')}}
 else if('un' in D_){if(t.value.trim()){db.users[D_.un].name=t.value.trim();save();toast('Disimpan')}}
});
document.addEventListener('input',e=>{
 const t=e.target;
 if(t.id==='os'){const q=t.value.toLowerCase();document.querySelectorAll('#ol .mi').forEach(r=>r.style.display=r.dataset.m.toLowerCase().includes(q)?'':'none')}
 else if(t.classList.contains('sp')){const r=t.closest('.mi'),c=D.it[r.dataset.m];if(c){c.p=+t.value.replace(/\D/g,'')||+r.dataset.p;oTot()}}
 else if(t.closest('#nl'))nTot();
});
render();
</script></body></html>
