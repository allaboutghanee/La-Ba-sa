async function createInvItem(){return run(async()=>{if(!['owner','admin'].includes(S.role))throw{message:'Hanya admin atau pemilik yang boleh mengelola master inventaris.'};const g=id=>Q('#'+id).value.trim(),name=g('ivName'),unit=g('ivUnit'),qty=+g('ivQty'),min=+g('ivMin'),cost=+g('ivCost');if(!name)throw{message:'Nama item wajib diisi.'};if(!(qty>=0)||!(min>=0)||!(cost>=0))throw{message:'Jumlah, stok minimum, dan modal tidak boleh negatif.'};if(S.stok.items.some(x=>x.n.toLowerCase()===name.toLowerCase()))throw{message:'Nama item sudah terdaftar.'};const item={n:name,s:unit,aw:qty,min,cost,category:g('ivCat'),location:g('ivLoc'),active:true};const id=invKey(name),cfg=FS.doc('stok/cfg'),bal=invRef(id),move=moveRef('opening_'+id);await FS.runTransaction(async tx=>{const cs=await tx.get(cfg),bs=await tx.get(bal),ms=await tx.get(move);if(bs.exists||ms.exists)throw{message:'ID inventaris sudah ada. Periksa nama item.'};const data=cs.exists?JSON.parse(cs.data().data||'{}'):{start:'',items:[]};data.items=data.items||[];if(data.items.some(x=>x.n.toLowerCase()===name.toLowerCase()))throw{message:'Nama item sudah terdaftar.'};data.items.push(item);tx.set(cfg,{data:JSON.stringify(data)});tx.set(bal,{item:name,unit,qty,updatedAt:firebase.firestore.FieldValue.serverTimestamp(),updatedBy:S.u.uid,lastMoveId:qty>0?move.id:''});if(qty>0)tx.set(move,{id:move.id,itemId:id,item:name,qty,beforeQty:0,afterQty:qty,unit,type:'manual_adjustment',date:S.date,createdAt:firebase.firestore.FieldValue.serverTimestamp(),by:S.u.uid,email:S.u.email,reason:'Saldo awal dimasukkan saat item inventaris dibuat',relatedType:'opening_balance'});});const fresh=await cfg.get();S.stok=JSON.parse(fresh.data().data);await refreshInventoryBalances();Q('#ivName').value='';},'Item inventaris ditambahkan ✓')}
async function transferInvItem(i){return run(async()=>{
 if(!['owner','admin'].includes(S.role))throw{message:'Transfer lokasi hanya boleh dilakukan admin atau pemilik.'};
 const item=S.stok.items[i];if(!item)throw{message:'Item tidak ditemukan.'};
 const field=Q('#ivTransfer_'+i),to=(field?.value||'').trim(),from=String(item.location||'').trim();
 if(!to)throw{message:'Isi lokasi tujuan.'};if(to.toLowerCase()===from.toLowerCase())throw{message:'Lokasi tujuan sama dengan lokasi asal.'};
 const id=invKey(item.n),cfg=FS.doc('stok/cfg'),bal=invRef(id),move=moveRef('transfer_'+uid());
 await FS.runTransaction(async tx=>{
  const cs=await tx.get(cfg),bs=await tx.get(bal),ms=await tx.get(move);
  if(!cs.exists)throw{message:'Konfigurasi inventaris tidak ditemukan.'};if(ms.exists)throw{message:'ID transfer sudah digunakan. Coba ulangi.'};
  const data=JSON.parse(cs.data().data||'{}'),target=(data.items||[]).find(x=>x.n.toLowerCase()===item.n.toLowerCase());
  if(!target)throw{message:'Master item berubah. Muat ulang inventaris.'};
  const current=bs.exists?+bs.data().qty:stockBaseQty(item.n);if(!(current>0))throw{message:'Tidak ada stok untuk dipindahkan.'};
  const next={...target,location:to};data.items=data.items.map(x=>x.n.toLowerCase()===item.n.toLowerCase()?next:x);
  tx.set(cfg,{data:JSON.stringify(data)});
  tx.set(bal,{item:item.n,unit:item.s,qty:current,updatedAt:firebase.firestore.FieldValue.serverTimestamp(),updatedBy:S.u.uid,lastMoveId:move.id});
  tx.set(move,{id:move.id,itemId:id,item:item.n,qty:0,beforeQty:current,afterQty:current,unit:item.s,type:'transfer',transferQty:current,fromLocation:from||'Belum ditentukan',toLocation:to,date:S.date,createdAt:firebase.firestore.FieldValue.serverTimestamp(),by:S.u.uid,email:S.u.email,reason:'Pemindahan seluruh stok item antar lokasi',relatedType:'location_transfer'});
 });
 const fresh=await cfg.get();S.stok=JSON.parse(fresh.data().data);await refreshInventoryBalances();
},'Seluruh stok dipindahkan ke '+((Q('#ivTransfer_'+i)||{}).value||'lokasi tujuan')+' ✓')}

 // Existing purchase ledger is the primary historical source; no manual re-entry is needed.
 all('buys').forEach(row=>{if(row[0]<=until&&row[2]==LB&&String(row[4]).trim().toLowerCase()==ing.name.toLowerCase()&&+row[5]>0&&+row[7]>=0){hist.push({date:row[0],qty:+row[5],purchaseUnit:normUnit(row[6]||ing.purchaseUnit),price:+row[7]})}});
 hist.sort((a,b)=>a.date.localeCompare(b.date));let q=0,v=0;hist.forEach(x=>{const base=convertQty(x.qty,x.purchaseUnit,ing.baseUnit);if(base!==null){q+=base;v+=x.qty*x.price}});
 if(q>0)return{unitCost:v/q,source:'rata-rata tertimbang pembelian',complete:true};
 if(Number.isFinite(+ing.manualCost)&&+ing.manualCost>0)return{unitCost:+ing.manualCost,source:'modal manual',complete:true};
 return{unitCost:0,source:'belum ada harga',complete:false};
}

 <div class="h3"><b class="sf">Catat biaya</b></div><div class="card"><label class="f" style="margin-top:0">Keterangan</label><input id="lrk" list="lrs" placeholder="Listrik, gas, plastik…" autocomplete="off">${dl("lrs",sug)}<div class="g"><div><label class="f">Jumlah</label><input id="lrn" type="number" inputmode="numeric"></div><div><label class="f">Tanggal</label><input id="lrd" type="date" max="${loc()}" value="${dd0}"></div></div><label class="f">Dibayar dari</label><select id="lra">${sel(A,A[0])}</select><button class="pb" onclick="simpanBiaya()">Simpan biaya</button><p class="mu sm" style="margin:10px 0 0">Biaya otomatis mengurangi saldo akun yang dipilih, jadi nggak perlu dicatat lagi di Kas lain.</p></div>
 ${rows.length?`<div class="h3"><b class="sf">Catatan biaya</b><span class="pill">${rows.length}</span></div><div class="card" style="padding:4px 16px">${rows.map(({y,k,r})=>`<div class="rw"><div class="x"><b>${esc(r.k||"Tanpa keterangan")}</b><small>${fs(r.d)} · ${esc(r.a)}${r.x?" · "+esc(r.x):""}</small></div><div class="a">${rp(r.n)}</div>${mnu("b"+y+"_"+k,[["Edit",`editKl('${y}',${k})`],["Hapus",`dKl('${y}',${k})`,"dl"+y+"_"+k]])}</div>`).join("")}</div>`:""}
 <div class="card" style="padding:4px 16px"><div class="ct" style="margin-top:12px">Di luar laba rugi usaha</div><table class="tb">${R("Belanja pribadi",rp(L.priv),"mu")}${R("Keperluan pribadi/keluarga (kas lain)",rp(L.fam),"mu")}${R(`Konsumsi keluarga <small>· ${L.kons} porsi</small>`,rp(L.konsumsiHPP),"mu")}${R("Estimasi setelah pengeluaran pribadi",rpS(L.laba-L.priv-L.fam),"t")}</table><p class="mu sm" style="margin:6px 0 12px">Nilai konsumsi keluarga memakai HPP resep jika tersedia. Ini pengambilan pribadi, bukan penjualan dan tidak mengurangi laba operasional.</p></div>
 <button class="pb" style="background:var(--tint);color:var(--tx)" onclick="lrShare()">Bagikan ringkasan</button>`}
async function lrShare(){const[f,t]=lrRange(),L=lrCalc(f,t),neg=L.laba<0,txt=`La Ba’sa · Estimasi laba rugi ${lrLabel()}\nOmzet: ${rp(L.om)}\nHPP: −${rp(L.bahan)}\nLaba kotor: ${rpS(L.kotor)}\nBiaya operasional: −${rp(L.biaya)}\n${neg?"Estimasi rugi":"Estimasi laba"}: ${rpS(L.laba)}${L.margin===null?"":" ("+(L.margin*100).toFixed(1).replace(".",",")+"% dari omzet)"}`;
 try{if(navigator.share)await navigator.share({text:txt});else{await navigator.clipboard.writeText(txt);T("Ringkasan disalin ✓")}}catch(e){if(e&&e.name!="AbortError"){try{await navigator.clipboard.writeText(txt);T("Ringkasan disalin ✓")}catch(_){S.msg="Tidak bisa membagikan ringkasan.";render()}}}}
const simpanBiaya=()=>run(async()=>{const g=i=>Q("#"+i).value,r={d:g("lrd"),k:g("lrk").trim(),j:"Uang keluar",a:g("lra"),n:+g("lrn"),c:KAT[1]};
 if(!r.k)throw{message:"Isi keterangan biaya, misalnya Listrik."};if(!(r.n>0))throw{message:"Isi jumlah biaya."};if(!r.d||r.d>loc())throw{message:"Cek tanggal, belum terjadi atau kosong."};
 const y=ym(r.d);await ens(y);S.kl[y]=await mut("kl",y,a=>a.push(r))},"Biaya tersimpan ✓");
function editKl(y,k){const r=(S.kl[y]||[])[k];if(!r)return;S.ek={y,j:JSON.stringify(r),v:{...r}};S.mn="";S.del="";S.msg="";render();scrollTo(0,0)}
function vEK(){const e=S.ek,v=e.v;return`${hdr("Edit catatan kas","S.ek=null;render()")}<div class="card"><label class="f" style="margin-top:0">Tanggal</label><input type="date" id="ekd" max="${loc()}" value="${v.d}"><label class="f">Keterangan</label><input id="ekk" value="${esc(v.k||"")}"><div class="g"><div><label class="f">Jenis</label><select id="ekj" onchange="Q('#ekt').disabled=this.value!='Pindah uang'">${sel(["Uang masuk","Uang keluar","Pindah uang"],v.j)}</select></div><div><label class="f">Jumlah</label><input id="ekn" type="number" inputmode="numeric" value="${v.n}"></div></div><label class="f">Akun (pindah uang: akun asal)</label><select id="eka">${sel(A,v.a)}</select><label class="f">Ke akun (hanya pindah uang)</label><select id="ekt"${v.j=="Pindah uang"?"":" disabled"}>${sel(A,v.t||"")}</select><label class="f">Kategori</label><select id="ekc"><option value=""></option>${sel(KAT,v.c||"")}</select><label class="f">Catatan (opsional)</label><input id="ekx" value="${esc(v.x||"")}"></div><button class="pb" onclick="saveEK()">Simpan perubahan</button>`}
const saveEK=()=>run(async()=>{const e=S.ek,g=i=>Q("#"+i).value,d=g("ekd");if(!d||d>loc())throw{message:"Cek tanggal, belum terjadi atau kosong."};
 const r={d,k:g("ekk").trim(),j:g("ekj"),a:g("eka"),n:+g("ekn")};if(r.j=="Pindah uang")r.t=g("ekt");if(g("ekc"))r.c=g("ekc");if(g("ekx").trim())r.x=g("ekx").trim();
 if(!klok(r))throw{message:r.j=="Pindah uang"?"Isi jumlah, dan pilih dua akun yang berbeda.":"Isi jumlah dan akun."};
 const y0=e.y,y1=ym(d),fi=a=>a.findIndex(x=>JSON.stringify(x)==e.j),gone=()=>{throw{message:"Data sudah berubah, buka ulang."}};
 if(y1==y0)S.kl[y0]=await mut("kl",y0,a=>{const i=fi(a);if(i<0)gone();a[i]=r});else{S.kl[y0]=await mut("kl",y0,a=>{const i=fi(a);if(i<0)gone();a.splice(i,1)});await ens(y1);S.kl[y1]=await mut("kl",y1,a=>a.push(r))}
 S.ek=null},"Perubahan disimpan ✓");
function dKl(y,k){const key="dl"+y+"_"+k;if(S.del!=key){S.del=key;return sr0()}S.del="";S.mn="";const j=JSON.stringify(S.kl[y][k]);run(async()=>{S.kl[y]=await mut("kl",y,a=>{const i=a.findIndex(x=>JSON.stringify(x)==j);if(i>=0)a.splice(i,1)})},"Dihapus")}
</script>
<script>
/* ===== LABA RUGI DI BERANDA (harian & bulanan, satu kali hitung, ringan) ===== */
const lrMode=()=>S.lrh||(S.lrh=(()=>{try{return localStorage.getItem("lrh")}catch(e){return null}})()||"m");
const lrPrevM=y=>{const[a,b]=y.split("-").map(Number),n=new Date(a,b-2,1);return n.getFullYear()+"-"+String(n.getMonth()+1).padStart(2,"0")};
/* tanggal → {om,bh,bi}. Aturan sama persis dengan halaman Laba rugi (dasar kas) */
function lrAgg(y){const m={},g=d=>m[d]||(m[d]={om:0,bh:0,bi:0});
 (S.sales[y]||[]).forEach(o=>{if(o.inventoryStatus!=="refunded"&&(o.m=="Tunai"||o.m=="QRIS"))g(o.d).om+=tot(o)});
 (S.buys[y]||[]).forEach(r=>{if(r[2]==LB){const c=katB(r);if(c=="Bahan baku")g(r[0]).bh+=bt(r);else if(isOps(c))g(r[0]).bi+=bt(r)}});
 (S.kl[y]||[]).forEach(r=>{if(klok(r)&&r.j=="Uang keluar"&&r.c==KAT[1])g(r.d).bi+=r.n});
 return m}
const lrSum=m=>{let om=0,bh=0,bi=0;for(const d in m){const v=m[d];om+=v.om;bh+=v.bh;bi+=v.bi}return{om,bh,bi,laba:om-bh-bi}};
const lrDl=(c,p,t)=>{if(!p)return c||p?"":"Belum ada data";const d=Math.round((c-p)/Math.abs(p)*100);return(d>=0?"↑ ":"↓ ")+Math.abs(d)+"% "+t};
function lrData(){
 const d0=S.date,y=ym(d0),py=lrPrevM(y),cur=lrAgg(y),prv=lrAgg(py),pad=n=>String(n).padStart(2,"0");
 const at=d=>{const k=ym(d);return(k==y?cur:k==py?prv:{})[d]};
 const lb=v=>v?v.om-v.bh-v.bi:null,z={om:0,bh:0,bi:0};
 const v0=at(d0)||z,v1=at(dd(1,d0))||z,dl0=v0.om-v0.bh-v0.bi,dl1=v1.om-v1.bh-v1.bi;
 const days=[6,5,4,3,2,1,0].map(n=>dd(n,d0));
 const wk=d=>new Date(d+"T00:00").toLocaleDateString("id-ID",{weekday:"short"});
 const D={om:v0.om,bh:v0.bh,bi:v0.bi,laba:dl0,lab:S.date==loc()?"Hari ini":fs(d0),dl:lrDl(dl0,dl1,"dari kemarin"),vals:days.map(d=>lb(at(d))),sel:6,xl:days.map(wk)};
 const sm0=lrSum(cur),sp=lrSum(prv),[a,b]=y.split("-").map(Number),nd=new Date(a,b,0).getDate();
 const M={...sm0,lab:y==ym(loc())?"Bulan ini":new Date(y+"-01T00:00").toLocaleDateString("id-ID",{month:"short",year:"numeric"}),dl:lrDl(sm0.laba,sp.laba,"dari bulan lalu"),vals:Array.from({length:nd},(_,i)=>lb(cur[y+"-"+pad(i+1)])),sel:+d0.slice(8)-1,xl:["1","10","20",String(nd)]};
 return{d:D,m:M,py}}
function lrBars(vals,sel){
 const H=64,n=vals.length,pos=Math.max(0,...vals.map(v=>v==null?0:v)),neg=Math.max(0,...vals.map(v=>v==null?0:-v)),sc=(H-6)/((pos+neg)||1),zy=Math.round(3+pos*sc);
 return`<div class="lrch"><u style="top:${zy}px"></u>${vals.map((v,i)=>{const l=(i*100/n).toFixed(2),w=`calc(${(100/n).toFixed(2)}% - 3px)`;
  if(v==null||v==0)return`<i class="e" style="left:${l}%;width:${w};top:${zy-1}px;height:2px;--k:${i}"></i>`;
  const h=Math.max(3,Math.round(Math.abs(v)*sc)),top=v>0?zy-h:zy;
  return`<i class="${v<0?"dn ":""}${i==sel?"s":""}" style="left:${l}%;width:${w};top:${top}px;height:${h}px;--k:${i}"></i>`}).join("")}</div>`}
function lrDetail(r){
 const tt=Math.max(r.om,r.bh+r.bi,1),w=v=>(Math.max(0,v)/tt*100).toFixed(1),neg=r.laba<0,pc2=v=>r.om?Math.round(v/r.om*100)+"%":"0%";
 const sum=r.om?"Omzet "+rp(r.om)+" · "+(neg?"Rugi ":"Margin ")+Math.abs(r.laba/r.om*100).toFixed(1).replace(".",",")+"%":"Belum ada penjualan";
 return`<div class="lrs">${sum}</div><div class="lrb">${[[r.bh,"a"],[r.bi,"b"],[Math.max(0,r.laba),"c"]].filter(x=>x[0]>0).map(x=>`<i class="${x[1]}" style="width:${w(x[0])}%"></i>`).join("")}</div><div class="lrg"><span><s class="a"></s>Bahan ${pc2(r.bh)}</span><span><s class="b"></s>Biaya ${pc2(r.bi)}</span><span><s class="c"></s>${neg?"Rugi":"Laba"} ${pc2(Math.abs(r.laba))}</span></div>${lrBars(r.vals,r.sel)}<div class="lrx">${r.xl.map(x=>`<span>${x}</span>`).join("")}</div>`}
function lrCard(){
 const m=lrMode(),X=lrData();
 if(HAS&&typeof FS!="undefined"&&FS&&!subs[X.py])ens(X.py).catch(()=>{});
 return`<div class="h3"><b class="sf">Laba rugi</b><a onclick="openLR()">Detail →</a></div><div class="card lrc" id="lrc"><div class="lrt">${["d","m"].map(k=>{const r=X[k];return`<button class="${m==k?"on":""}" aria-pressed="${m==k}" onclick="lrPick('${k}')"><small>${r.lab}</small><b class="${r.laba<0?"neg":""}">${N(r.laba,"lr"+k)}</b><em>${r.dl||"&nbsp;"}</em></button>`}).join("")}</div><div class="lrd" id="lrd">${lrDetail(X[m])}</div><p class="mu sm" style="margin:10px 0 0">Angka laba rugi belum final jika resep atau harga modal bahan belum lengkap. Pembelian bahan tidak otomatis dianggap HPP.</p></div>`}
function lrPick(k){if(lrMode()==k)return;S.lrh=k;try{localStorage.setItem("lrh",k)}catch(e){}
 const c=Q("#lrc"),t=Q("#lrd");if(!c||!t)return;
 c.querySelectorAll(".lrt button").forEach(b=>{const on=b.getAttribute("onclick")=="lrPick('"+k+"')";b.classList.toggle("on",on);b.setAttribute("aria-pressed",on)});
 t.innerHTML=lrDetail(lrData()[k]);
 if(!matchMedia("(prefers-reduced-motion:reduce)").matches)t.animate([{opacity:0,transform:"translateY(6px)"},{opacity:1,transform:"none"}],{duration:300,easing:"cubic-bezier(.22,.8,.24,1)"})}
function openLR(){S.lrm=ym(S.date);go("m","lr",lrMode()=="d"?1:0)}
</script>
