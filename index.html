 }

async function lrShare(){const[f,t]=lrRange(),L=lrCalc(f,t),neg=L.laba<0,txt=`La Ba’sa · Laba rugi ${lrLabel()}\nOmzet: ${rp(L.om)}\nBelanja bahan: −${rp(L.bahan)}\nLaba kotor: ${rpS(L.kotor)}\nBiaya operasional: −${rp(L.biaya)}\n${neg?"Rugi bersih":"Laba bersih"}: ${rpS(L.laba)}${L.margin===null?"":" ("+(L.margin*100).toFixed(1).replace(".",",")+"% dari omzet)"}`;
 try{if(navigator.share)await navigator.share({text:txt});else{await navigator.clipboard.writeText(txt);T("Ringkasan disalin ✓")}}catch(e){if(e&&e.name!="AbortError"){try{await navigator.clipboard.writeText(txt);T("Ringkasan disalin ✓")}catch(_){S.msg="Tidak bisa membagikan ringkasan.";render()}}}}
const simpanBiaya=()=>run(async()=>{const g=i=>Q("#"+i).value,r={d:g("lrd"),k:g("lrk").trim(),j:"Uang keluar",a:g("lra"),n:+g("lrn"),c:KAT[1]};
 if(!r.k)throw{message:"Isi keterangan biaya, misalnya Listrik."};if(!(r.n>0))throw{message:"Isi jumlah biaya."};if(!r.d||r.d>loc())throw{message:"Cek tanggal, belum terjadi atau kosong."};
 const y=ym(r.d);await ens(y);S.kl[y]=await mut("kl",y,a=>a.push(r))},"Biaya tersimpan ✓");
function editKl(y,k){const r=(S.kl[y]||[])[k];if(!r)return;S.ek={y,j:JSON.stringify(r),v:{...r}};S.mn="";S.del="";S.msg="";render();scrollTo(0,0)}
function vEK(){const e=S.ek,v=e.v;return`${hdr("Edit catatan kas","S.ek=null;render()")}<div class="card"><label class="f" style="margin-top:0">Tanggal</label><input type="date" id="ekd" max="${loc()}" value="${v.d}"><label class="f">Keterangan</label><input id="ekk" value="${esc(v.k||"")}"><div class="g"><div><label class="f">Jenis</label><select id="ekj" onchange="Q('#ekt').disabled=this.value!='Pindah uang'">${sel(["Uang masuk","Uang keluar","Pindah uang"],v.j)}</select></div><div><label class="f">Jumlah</label><input id="ekn" type="number" inputmode="numeric" value="${v.n}"></div></div><label class="f">Akun (pindah uang: akun asal)</label><select id="eka">${sel(A,v.a)}</select><label class="f">Ke akun (hanya pindah uang)</label><select id="ekt"${v.j=="Pindah uang"?"":" disabled"}>${sel(A,v.t||"")}</select><label class="f">Kategori</label><select id="ekc"><option value=""></option>${sel(KAT,v.c||"")}</select><label class="f">Catatan (opsional)</label><input id="ekx" value="${esc(v.x||"")}"></div><button class="pb" onclick="saveEK()">Simpan perubahan</button>`}
const saveEK=()=>run(async()=>{const e=S.ek,g=i=>Q("#"+i).value,d=g("ekd");if(!d||d>loc())throw{message:"Cek tanggal, belum terjadi atau kosong."};
 const r={d,k:g("ekk").trim(),j:g("ekj"),a:g("eka"),n:+g("ekn")};if(r.j=="Pindah uang")r.t=g("ekt");if(g("ekc"))r.c=g("ekc");if(g("ekx").trim())r.x=g("ekx").trim();
 if(!klok(r))throw{message:r.j=="Pindah uang"?"Isi jumlah, dan pilih dua akun yang berbeda.":"Isi jumlah dan akun."};
 const y0=e.y,y1=ym(d),fi=a=>a.findIndex(x=>JSON.stringify(x)==e.j),gone=()=>{throw{message:"Data sudah berubah, buka ulang."}};
 if(y1==y0)S.kl[y0]=await mut("kl",y0,a=>{const i=fi(a);if(i<0)gone();a[i]=r});else{S.kl[y0]=await mut("kl",y0,a=>{const i=fi(a);if(i<0)gone();a.splice(i,1)});await ens(y1);S.kl[y1]=await mut("kl",y1,a=>a.push(r))}
 S.ek=null},"Perubahan disimpan ✓");
function dKl(y,k){const key="dl"+y+"_"+k;if(S.del!=key){S.del=key;return sr0()}S.del="";S.mn="";const j=JSON.stringify(S.kl[y][k]);run(async()=>{S.kl[y]=await mut("kl",y,a=>{const i=a.findIndex(x=>JSON.stringify(x)==j);if(i>=0)a.splice(i,1)})},"Dihapus")}
</script>
<script>
/* ===== LABA RUGI DI BERANDA (harian & bulanan, satu kali hitung, ringan) ===== */
const lrMode=()=>S.lrh||(S.lrh=(()=>{try{return localStorage.getItem("lrh")}catch(e){return null}})()||"m");
const lrPrevM=y=>{const[a,b]=y.split("-").map(Number),n=new Date(a,b-2,1);return n.getFullYear()+"-"+String(n.getMonth()+1).padStart(2,"0")};
/* tanggal → {om,bh,bi}. Aturan sama persis dengan halaman Laba rugi (dasar kas) */
function lrAgg(y){const m={},g=d=>m[d]||(m[d]={om:0,bh:0,bi:0});
 (S.sales[y]||[]).forEach(o=>{if(o.m=="Tunai"||o.m=="QRIS")g(o.d).om+=tot(o)});
 (S.buys[y]||[]).forEach(r=>{if(r[2]==LB){const c=katB(r);if(c=="Bahan baku")g(r[0]).bh+=bt(r);else if(isOps(c))g(r[0]).bi+=bt(r)}});
 (S.kl[y]||[]).forEach(r=>{if(klok(r)&&r.j=="Uang keluar"&&r.c==KAT[1])g(r.d).bi+=r.n});
 return m}
const lrSum=m=>{let om=0,bh=0,bi=0;for(const d in m){const v=m[d];om+=v.om;bh+=v.bh;bi+=v.bi}return{om,bh,bi,laba:om-bh-bi}};
const lrDl=(c,p,t)=>{if(!p)return c||p?"":"Belum ada data";const d=Math.round((c-p)/Math.abs(p)*100);return(d>=0?"↑ ":"↓ ")+Math.abs(d)+"% "+t};
function lrData(){
 const d0=S.date,y=ym(d0),py=lrPrevM(y),cur=lrAgg(y),prv=lrAgg(py),pad=n=>String(n).padStart(2,"0");
 const at=d=>{const k=ym(d);return(k==y?cur:k==py?prv:{})[d]};
 const lb=v=>v?v.om-v.bh-v.bi:null,z={om:0,bh:0,bi:0};
 const v0=at(d0)||z,v1=at(dd(1,d0))||z,dl0=v0.om-v0.bh-v0.bi,dl1=v1.om-v1.bh-v1.bi;
 const days=[6,5,4,3,2,1,0].map(n=>dd(n,d0));
 const wk=d=>new Date(d+"T00:00").toLocaleDateString("id-ID",{weekday:"short"});
 const D={om:v0.om,bh:v0.bh,bi:v0.bi,laba:dl0,lab:S.date==loc()?"Hari ini":fs(d0),dl:lrDl(dl0,dl1,"dari kemarin"),vals:days.map(d=>lb(at(d))),sel:6,xl:days.map(wk)};
 const sm0=lrSum(cur),sp=lrSum(prv),[a,b]=y.split("-").map(Number),nd=new Date(a,b,0).getDate();
 const M={...sm0,lab:y==ym(loc())?"Bulan ini":new Date(y+"-01T00:00").toLocaleDateString("id-ID",{month:"short",year:"numeric"}),dl:lrDl(sm0.laba,sp.laba,"dari bulan lalu"),vals:Array.from({length:nd},(_,i)=>lb(cur[y+"-"+pad(i+1)])),sel:+d0.slice(8)-1,xl:["1","10","20",String(nd)]};
 return{d:D,m:M,py}}
function lrBars(vals,sel){
 const H=64,n=vals.length,pos=Math.max(0,...vals.map(v=>v==null?0:v)),neg=Math.max(0,...vals.map(v=>v==null?0:-v)),sc=(H-6)/((pos+neg)||1),zy=Math.round(3+pos*sc);
 return`<div class="lrch"><u style="top:${zy}px"></u>${vals.map((v,i)=>{const l=(i*100/n).toFixed(2),w=`calc(${(100/n).toFixed(2)}% - 3px)`;
  if(v==null||v==0)return`<i class="e" style="left:${l}%;width:${w};top:${zy-1}px;height:2px;--k:${i}"></i>`;
  const h=Math.max(3,Math.round(Math.abs(v)*sc)),top=v>0?zy-h:zy;
  return`<i class="${v<0?"dn ":""}${i==sel?"s":""}" style="left:${l}%;width:${w};top:${top}px;height:${h}px;--k:${i}"></i>`}).join("")}</div>`}
function lrDetail(r){
 const tt=Math.max(r.om,r.bh+r.bi,1),w=v=>(Math.max(0,v)/tt*100).toFixed(1),neg=r.laba<0,pc2=v=>r.om?Math.round(v/r.om*100)+"%":"0%";
 const sum=r.om?"Omzet "+rp(r.om)+" · "+(neg?"Rugi ":"Margin ")+Math.abs(r.laba/r.om*100).toFixed(1).replace(".",",")+"%":"Belum ada penjualan";
 return`<div class="lrs">${sum}</div><div class="lrb">${[[r.bh,"a"],[r.bi,"b"],[Math.max(0,r.laba),"c"]].filter(x=>x[0]>0).map(x=>`<i class="${x[1]}" style="width:${w(x[0])}%"></i>`).join("")}</div><div class="lrg"><span><s class="a"></s>Bahan ${pc2(r.bh)}</span><span><s class="b"></s>Biaya ${pc2(r.bi)}</span><span><s class="c"></s>${neg?"Rugi":"Laba"} ${pc2(Math.abs(r.laba))}</span></div>${lrBars(r.vals,r.sel)}<div class="lrx">${r.xl.map(x=>`<span>${x}</span>`).join("")}</div>`}
function lrCard(){
 const m=lrMode(),X=lrData();
 if(HAS&&typeof FS!="undefined"&&FS&&!subs[X.py])ens(X.py).catch(()=>{});
 return`<div class="h3"><b class="sf">Laba rugi</b><a onclick="openLR()">Detail →</a></div><div class="card lrc" id="lrc"><div class="lrt">${["d","m"].map(k=>{const r=X[k];return`<button class="${m==k?"on":""}" aria-pressed="${m==k}" onclick="lrPick('${k}')"><small>${r.lab}</small><b class="${r.laba<0?"neg":""}">${N(r.laba,"lr"+k)}</b><em>${r.dl||"&nbsp;"}</em></button>`}).join("")}</div><div class="lrd" id="lrd">${lrDetail(X[m])}</div></div>`}
function lrPick(k){if(lrMode()==k)return;S.lrh=k;try{localStorage.setItem("lrh",k)}catch(e){}
 const c=Q("#lrc"),t=Q("#lrd");if(!c||!t)return;
 c.querySelectorAll(".lrt button").forEach(b=>{const on=b.getAttribute("onclick")=="lrPick('"+k+"')";b.classList.toggle("on",on);b.setAttribute("aria-pressed",on)});
 t.innerHTML=lrDetail(lrData()[k]);
 if(!matchMedia("(prefers-reduced-motion:reduce)").matches)t.animate([{opacity:0,transform:"translateY(6px)"},{opacity:1,transform:"none"}],{duration:300,easing:"cubic-bezier(.22,.8,.24,1)"})}
function openLR(){S.lrm=ym(S.date);go("m","lr",lrMode()=="d"?1:0)}
</script>
